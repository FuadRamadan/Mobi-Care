          schema:
            type: string
            enum: [orders, patients, notifications, catalogue, inventory]
      responses:
        "200":
          description: Current records in CSV format
          content:
            text/csv:
              schema:
                type: string

  /hq/couriers:
    get:
      operationId: listCouriers
      tags: [hq]
      summary: Courier fleet with live delivery load
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Couriers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Courier"
    post:
      operationId: createCourier
      tags: [hq]
      summary: Add a courier
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourierInput"
      responses:
        "201":
          description: Created courier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Courier"

  /hq/couriers/{id}:
    patch:
      operationId: updateCourier
      tags: [hq]
      summary: Edit or activate/deactivate a courier
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourierUpdate"
      responses:
        "200":
          description: Updated courier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Courier"
    delete:
      operationId: deleteCourier
      tags: [hq]
      summary: Remove a courier from the fleet
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted courier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "404":
          description: Courier not found
        "409":
          description: Courier has active deliveries

  /hq/couriers/{id}/photo-upload:
    post:
      operationId: requestCourierPhotoUpload
      tags: [hq]
      summary: Request a direct upload URL for a courier portrait
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CourierPhotoUploadRequest" }
      responses:
        "200":
          description: Signed upload target
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PresignedUpload" }

  /hq/couriers/{id}/photo:
    patch:
      operationId: attachCourierPhoto
      tags: [hq]
      summary: Attach a completed courier portrait upload
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CourierPhotoAttach" }
      responses:
        "200":
          description: Updated courier
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Courier" }
    delete:
      operationId: removeCourierPhoto
      tags: [hq]
      summary: Remove a courier portrait
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated courier
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Courier" }

  /hq/flags:
    get:
      operationId: listFlags
      tags: [hq]
      summary: Fraud/anomaly flags queue
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, reviewed]
      responses:
        "200":
          description: Flags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HqFlag"

  /hq/flags/{id}/review:
    post:
      operationId: reviewFlag
      tags: [hq]
      summary: Mark a flag reviewed with a note
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlagReviewInput"
      responses:
        "200":
          description: Reviewed flag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HqFlag"

  /hq/delivery-zones:
    get:
      operationId: listDeliveryZones
      tags: [hq]
      summary: Delivery zones with their fees, and the zone each pharmacy sits in
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Zones and pharmacy placements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryZonesResponse"
    post:
      operationId: createDeliveryZone
      tags: [hq]
      summary: Draw a new delivery zone with its first fee (in force immediately)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryZoneInput"
      responses:
        "201":
          description: Created zone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryZone"
        "409":
          description: Overlaps an active zone, or the name is taken
        "422":
          description: The outline breaks a drawing rule

  /hq/delivery-zones/locate:
    get:
      operationId: locateDeliveryZone
      tags: [hq]
      summary: The active zone a location falls in
      security:
        - BearerAuth: []
      parameters:
        - name: latitude
          in: query
          required: true
          schema:
            type: number
        - name: longitude
          in: query
          required: true
          schema:
            type: number
      responses:
        "200":
          description: The zone, or nulls when the location is outside every zone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryZoneLocation"

  /hq/delivery-zones/preview:
    post:
      operationId: previewDeliveryZone
      tags: [hq]
      summary: Check an outline before saving it, and list the pharmacies it would move
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryZonePreviewInput"
      responses:
        "200":
          description: Validity, overlaps and pharmacy changes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryZonePreview"

  /hq/delivery-zones/{id}:
    patch:
      operationId: updateDeliveryZone
      tags: [hq]
      summary: Rename, describe or redraw a zone
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryZoneUpdate"
      responses:
        "200":
          description: Updated zone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryZone"
        "409":
          description: Overlaps an active zone, or the name is taken
        "422":
          description: The outline breaks a drawing rule

  /hq/delivery-zones/{id}/fee:
    put:
      operationId: scheduleDeliveryZoneFee
      tags: [hq]
      summary: Set a new fee, taking effect at the next midnight (Africa/Freetown)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryZoneFeeInput"
      responses:
        "200":
          description: Zone with the scheduled change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryZone"

  /hq/delivery-zones/{id}/fee/scheduled:
    delete:
      operationId: cancelScheduledDeliveryZoneFee
      tags: [hq]
      summary: Cancel a fee change that has not taken effect yet
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Zone without the scheduled change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryZone"

  /hq/delivery-zones/{id}/status:
    post:
      operationId: setDeliveryZoneStatus
      tags: [hq]
      summary: Switch a zone on or off (immediately)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryZoneStatusInput"
      responses:
        "200":
          description: Updated zone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryZone"
        "409":
          description: Switching it on would overlap an active zone

  /hq/audit:
    get:
      operationId: listAuditLog
      tags: [hq]
      summary: Append-only audit log (read-only, filterable by entity)
      security:
        - BearerAuth: []
      parameters:
        - name: entityType
          in: query
          required: false
          schema:
            type: string
        - name: entityId
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: number
      responses:
        "200":
          description: Audit entries, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEntry"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    PatientPasswordResetRequest:
      type: object
      properties:
        phone:
          type: string
          minLength: 5
      required: [phone]

    PatientPasswordResetRequested:
      type: object
      properties:
        requestId:
          type: string
          pattern: '^[0-9a-fA-F-]{36}$'
        message:
          type: string
        retryAfterSeconds:
          type: number
          minimum: 0
      required: [requestId, message, retryAfterSeconds]

    PatientPasswordResetConfirm:
      type: object
      properties:
        requestId:
          type: string
          pattern: '^[0-9a-fA-F-]{36}$'
        code:
          type: string
          pattern: '^[0-9]{6}$'
        newPassword:
          type: string
          minLength: 8
      required: [requestId, code, newPassword]

    # ── Auth schemas ───────────────────────────────────────────────────────
    LoginInput:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
          description: Username or phone number
        password:
          type: string

    RefreshInput:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    ChangePasswordInput:
      type: object
      required: [newPassword]
      properties:
        currentPassword:
          type: string
          description: Required, except for a patient setting a first password after signing up with Google
        newPassword:
          type: string
          minLength: 8

    PasswordChangeResult:
      type: object
      required: [message]
      properties:
        message:
          type: string
        accessToken:
          type: string
          description: Fresh access token (pharmacy accounts only)
        refreshToken:
          type: string
          description: Fresh refresh token (pharmacy accounts only)
        user:
          $ref: "#/components/schemas/PharmacyUser"
        passwordPolicy:
          $ref: "#/components/schemas/PasswordPolicy"

    PharmacyUser:
      type: object
      required: [id, role, name, username]
      properties:
        id:
          type: string

        role:
          type: string
          enum: [pharmacy, hq, patient]
        name:
          type: string
        username:
          type: string
        phone:
          type: ["string", "null"]
        photoUrl:
          type: ["string", "null"]
        controlledSubstanceAuthorized:
          type: boolean
          description: Present for pharmacy accounts only
        mustChangePassword:
          type: boolean
          description: Pharmacy accounts onboarded with a temp password must change it before using the portal API
        passwordLastChangedAt:
          type: string
          description: ISO timestamp of the pharmacy account's most recent password change
        canManageIntegrations:
          type: boolean
        canManageSettlements:
          type: boolean
          description: Present for HQ accounts; controls access to API connection management
        canViewDataInsights:
          type: boolean
          description: Present for HQ accounts; controls access to aggregate-only Data & Insights
        canManageCatalogue:
          type: boolean
          description: Present for HQ accounts; controls adding, changing, approving and importing catalogue medicines

    TokenPair:
      type: object
      required: [accessToken, refreshToken]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string

    GoogleSignInConfig:
      type: object
      required: [clientId]
      properties:
        clientId:
          type: ["string", "null"]

    GoogleCredentialInput:
      type: object
      required: [credential]
      properties:
        credential:
          type: string
          description: The ID token Google's button returned

    GoogleSignInResult:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [signed_in, needs_profile]
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          $ref: "#/components/schemas/PharmacyUser"
        signupToken:
          type: string
          description: For needs_profile, sent back with the phone number and date of birth
        name:
          type: ["string", "null"]
        email:
          type: ["string", "null"]

    GoogleSignUpInput:
      type: object
      required: [signupToken, name, phone, dateOfBirth, acceptTermsAndPrivacy]
      properties:
        signupToken:
          type: string
        name:
          type: string
          minLength: 2
        phone:
          type: string
          minLength: 5
        dateOfBirth:
          type: string
          format: date
        acceptTermsAndPrivacy:
          type: boolean
          enum: [true]
        acceptResearchAnalytics:
          type: boolean

    GoogleConnection:
      type: object
      required: [googleConnected]
      properties:
        googleConnected:
          type: boolean

    AuthResponse:
      type: object
      required: [accessToken, refreshToken, user]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          $ref: "#/components/schemas/PharmacyUser"
        passwordPolicy:
          $ref: "#/components/schemas/PasswordPolicy"

    # ── Order schemas ──────────────────────────────────────────────────────
    OrderStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [confirmed, packaging, ready]

    CollectedConfirmation:
      type: object
      required: [idChecked]
      properties:
        idChecked:
          type: boolean

    OrderItem:
      type: object
      required:
        [
          id,
          orderId,
          drugId,
          drugName,
          quantity,
          unitPriceLeones,
          baseUnitPriceMinor,
          patientUnitPriceMinor,
          patientLineTotalMinor,
        ]
      properties:
        id:
          type: string

        orderId:
          type: string

        drugId:
          type: string
        inventoryId:
          type: ["string", "null"]

        drugName:
          type: string
        brand:
          type: ["string", "null"]
          description: The product bought, copied from the listing when the order was placed
        manufacturer:
          type: ["string", "null"]
        countryOfOrigin:
          type: ["string", "null"]
        quantity:
          type: number
        unitPriceLeones:
          type: number
        baseUnitPriceMinor:
          type: number
        patientUnitPriceMinor:
          type: number
        patientLineTotalMinor:
          type: number
        prescriptionId:
          type: ["string", "null"]

    Order:
      type: object
      required:
        [
          id,
          pharmacyId,
          patientName,
          patientPhone,
          status,
          fulfillmentType,
          idChecked,
          totalLeones,
          createdAt,
          updatedAt,
          items,
        ]
      properties:
        id:
          type: string

        pharmacyId:
          type: string

        patientName:
          type: string
        patientPhone:
          type: string
        status:
          type: string
          enum:
            [
              awaiting_payment,
              paid,
              confirmed,
              packaging,
              ready,
              assigned,
              picked_up,
              delivering,
              delivered,
              collected,
              cancelled,
            ]
        fulfillmentType:
          type: string
          enum: [delivery, collection]
        idChecked:
          type: boolean
        totalLeones:
          type: number
        medicineMarkupBasisPoints:
          type: number
        pharmacyMedicineTotalMinor:
          type: number
        medicineCommissionMinor:
          type: number
        patientMedicineTotalMinor:
          type: number
        deliveryFeeMinor:
          type: number
        courierPayoutMinor:
          type: number
        deliveryCommissionMinor:
          type: number
        patientServiceFeeMinor:
          type: number
          description: Service fee the patient paid on top of the medicine prices.
        pharmacyCommissionMinor:
          type: number
          description: Commission kept from the pharmacy's price (split pricing).
        pricingModel:
          type: string
          description: "'patient_fee_v1' (patient pays 5%) or 'split_v1' (patient 2%, pharmacy 5%)"
        paymentProvider:
          type: string
          description: "'direct' (paid to the pharmacy) or 'monime' (payment link)"
        payableSince:
          type: ["string", "null"]
        paidAt:
          type: ["string", "null"]
        latePaymentStatus:
          type: ["string", "null"]
        completedAt:
          type: ["string", "null"]
        deliveryConfirmedAt:
          type: ["string", "null"]
        deliveryConfirmationMethod:
          type: ["string", "null"]
          enum: [patient, hq, null]
        deliveryConfirmedByHqUserId:
          type: ["string", "null"]
        prescriptionId:
          type: ["string", "null"]

        createdAt:
          type: string

        updatedAt:
          type: string

        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"

    # ── Patient schemas ────────────────────────────────────────────────────
    PatientRegisterInput:
      type: object
      required: [name, phone, password, dateOfBirth, acceptTermsAndPrivacy]
      properties:
        name:
          type: string
          minLength: 2
        phone:
          type: string
          minLength: 5
        password:
          type: string
          minLength: 8
        dateOfBirth:
          type: string
          format: date
          description: Date of birth in YYYY-MM-DD format; patient must be 18 or older
        acceptTermsAndPrivacy:
          type: boolean
          enum: [true]
          description: >
            Must be true. The account and the consent that permits holding it
            are created in one transaction; an account cannot exist without it.
        acceptResearchAnalytics:
          type: boolean
          default: false
          description: >
            Optional. Allows the patient's searches to be counted in the
            anonymous aggregate reporting. Omitting it is a refusal, and
            refusing costs the patient nothing.

    ConsentDecision:
      type: object
      required: [granted, policyVersion, recordedAt, outdated]
      properties:
        granted: { type: boolean }
        policyVersion: { type: ["string", "null"] }
        recordedAt: { type: ["string", "null"], format: date-time }
        outdated:
          type: boolean
          description: A decision made against superseded policy text.

    PatientConsentState:
      type: object
      required: [policyVersion, termsAndPrivacy, researchAnalytics, needsConsent, mayRecordAnalytics]
      properties:
        policyVersion: { type: string }
        termsAndPrivacy: { $ref: "#/components/schemas/ConsentDecision" }
        researchAnalytics: { $ref: "#/components/schemas/ConsentDecision" }
        needsConsent:
          type: boolean
          description: The patient must accept the current terms before creating anything further.
        mayRecordAnalytics:
          type: boolean
          description: Whether this patient's searches may be recorded at all.
        consents:
          type: array
          description: The wording shown to the patient, served with the state so the two cannot drift.
          items:
            type: object
            required: [type, title, body, required]
            properties:
              type: { type: string }
              title: { type: string }
              body: { type: string }
              required: { type: boolean }
              decision: { $ref: "#/components/schemas/ConsentDecision" }

    PatientConsentInput:
      type: object
      required: [termsAndPrivacy, researchAnalytics]
      properties:
        termsAndPrivacy:
          type: boolean
          description: Required to keep using MobiCare. Setting it false withdraws consent.
        researchAnalytics: { type: boolean }

    PatientErasureInput:
      type: object
      required: [confirm]
      properties:
        password:
          type: string
          description: The patient's current password. This cannot be undone.
        googleCredential:
          type: string
          description: For an account with no password, a fresh Google sign-in instead
        confirm:
          type: string
          description: Must be exactly "DELETE MY ACCOUNT".

    PatientErasureResult:
      type: object
      required: [erased, removed, retained]
      properties:
        erased: { type: boolean }
        removed:
          type: object
          properties:
            searchEvents: { type: number }
            notifications: { type: number }
            ordersAnonymised: { type: number }
            images: { type: number }
        retained:
          type: string
          description: Plain-language statement of what is kept, and why.

    PatientProfile:
      type: object
      required: [id, name, phone, dateOfBirth, age, nin, address, email, nationality, profileImageUrl, profileComplete]
      properties:
        id:
          type: string
        name:
          type: string
        phone:
          type: string
        age:
          type: number
        dateOfBirth:
          type: ["string", "null"]
          format: date
        nin:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        nationality:
          type: ["string", "null"]
        profileImageUrl:
          type: ["string", "null"]
        googleConnected:
          type: boolean
        hasPassword:
          type: boolean
        profileComplete:
          type: boolean

    PatientProfileUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 2
        nin:
          type: ["string", "null"]
          maxLength: 40
        address:
          type: ["string", "null"]
          maxLength: 300
        email:
          type: ["string", "null"]
          pattern: '^[^\s@]+@[^\s@]+\.[^\s@]+$'
        nationality:
          type: ["string", "null"]
          maxLength: 80

    PatientProfilePhotoInput:
      type: object
      required: [image]
      properties:
        image:
          type: string
          description: Base64 data URL (PNG, JPEG, or WebP, max 5 MB)

    DrugOffer:
      type: object
      required:
        [
          inventoryId,
          pharmacyId,
          pharmacyName,
          priceLeones,
          unitOfSale,
          inStock,
          stockQuantity,
          availableForDelivery,
          availableForCollection,
        ]
      properties:
        inventoryId:
          type: string
        pharmacyId:
          type: string
        pharmacyName:
          type: string
        pharmacyAddress:
          type: ["string", "null"]
        pharmacyPhone:
          type: ["string", "null"]
        mobileMoneyLines:
          type: array
          description: Empty when the pharmacy has published no way to be paid.
          items:
            $ref: "#/components/schemas/MobileMoneyLine"
        mobileMoneyNumber:
          type: ["string", "null"]
          deprecated: true
          description: First entry of mobileMoneyLines. Kept for older clients.
        mobileMoneyProvider:
          type: ["string", "null"]
          deprecated: true
          description: First entry of mobileMoneyLines. Kept for older clients.
        mobileMoneyAccountName:
          type: ["string", "null"]
        online:
          type: boolean
        estimatedDistanceKm:
          type: ["number", "null"]
        brand:
          type: ["string", "null"]
        manufacturer:
          type: ["string", "null"]
        countryOfOrigin:
          type: ["string", "null"]
        priceLeones:
          type: number
        unitOfSale:
          type: string
        inStock:
          type: boolean
        stockQuantity:
          type: number
        availableForDelivery:
          type: boolean
        availableForCollection:
          type: boolean

    DrugSearchResult:
      type: object
      required:
        [
          listingKey,
          drugId,
          name,
          strength,
          form,
          unitOfSale,
          tier,
          prescriptionRequired,
          collectionOnly,
          offers,
        ]
      properties:
        listingKey:
          type: string
        drugId:
          type: string
        name:
          type: string
        genericName:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        tier:
          type: string
          enum: ["1", "2", "3"]
        unit:
          type: string
        strength:
          type: string
        form:
          type: string
        unitOfSale:
          type: string
        primaryCategory:
          oneOf:
            - $ref: "#/components/schemas/DrugPrimaryCategory"
            - type: "null"
        subcategory:
          oneOf:
            - $ref: "#/components/schemas/DrugSubcategory"
            - type: "null"
        maxUnitsPerOrder:
          type: ["number", "null"]
        prescriptionRequired:
          type: boolean
        collectionOnly:
          type: boolean
        offers:
          type: array
          items:
            $ref: "#/components/schemas/DrugOffer"

    PatientOrderItemInput:
      type: object
      required: [inventoryId, quantity]
      properties:
        inventoryId:
          type: string
        quantity:
          type: number
          minimum: 1

    ZoneBoundary:
      type: object
      description: GeoJSON Polygon or MultiPolygon; coordinates are [longitude, latitude]
      required: [type, coordinates]
      properties:
        type:
          type: string
          enum: [Polygon, MultiPolygon]
        coordinates:
          type: array
          items: {}

    DeliveryZone:
      type: object
      required: [id, name, description, boundary, isActive, areaSquareKm, currentFeeMinor, scheduledFee, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        boundary:
          $ref: "#/components/schemas/ZoneBoundary"
        isActive: { type: boolean }
        areaSquareKm: { type: number }
        currentFeeMinor: { type: ["number", "null"] }
        scheduledFee:
          oneOf:
            - $ref: "#/components/schemas/ScheduledDeliveryFee"
            - type: "null"
        updatedAt: { type: string }

    ScheduledDeliveryFee:
      type: object
      required: [feeMinor, effectiveFrom]
      properties:
        feeMinor: { type: number }
        effectiveFrom: { type: string }

    PharmacyZonePlacement:
      type: object
      required: [id, name, isActive, latitude, longitude, zoneId, zoneName]
      properties:
        id: { type: string }
        name: { type: string }
        isActive: { type: boolean }
        latitude: { type: ["number", "null"] }
        longitude: { type: ["number", "null"] }
        zoneId: { type: ["string", "null"] }
        zoneName: { type: ["string", "null"] }

    DeliveryZonesResponse:
      type: object
      required: [zones, pharmacies, feeChangesTakeEffectAt]
      properties:
        zones:
          type: array
          items:
            $ref: "#/components/schemas/DeliveryZone"
        pharmacies:
          type: array
          items:
            $ref: "#/components/schemas/PharmacyZonePlacement"
        feeChangesTakeEffectAt:
          type: string
          description: When a fee set now would take effect (the next midnight in Freetown)

    DeliveryZoneInput:
      type: object
      required: [name, boundary, feeMinor]
      properties:
        name: { type: string }
        description: { type: string }
        boundary:
          $ref: "#/components/schemas/ZoneBoundary"
        feeMinor: { type: number }

    DeliveryZoneUpdate:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        boundary:
          $ref: "#/components/schemas/ZoneBoundary"

    DeliveryZoneFeeInput:
      type: object
      required: [feeMinor]
      properties:
        feeMinor: { type: number }

    DeliveryZoneStatusInput:
      type: object
      required: [isActive]
      properties:
        isActive: { type: boolean }

    DeliveryZoneLocation:
      type: object
      required: [zoneId, zoneName, feeMinor]
      properties:
        zoneId: { type: ["string", "null"] }
        zoneName: { type: ["string", "null"] }
        feeMinor: { type: ["number", "null"] }

    DeliveryZonePreviewInput:
      type: object
      required: [boundary]
      properties:
        zoneId: { type: string }
        name: { type: string }
        boundary:
          $ref: "#/components/schemas/ZoneBoundary"
        isActive: { type: boolean }

    DeliveryZonePreview:
      type: object
      required: [valid, error, overlaps, changes]
      properties:
        valid: { type: boolean }
        error: { type: ["string", "null"] }
        overlaps:
          type: array
          items: { type: string }
        areaSquareKm: { type: number }
        changes:
          type: array
          items:
            type: object
            required: [pharmacyId, pharmacyName, fromZone, toZone]
            properties:
              pharmacyId: { type: string }
              pharmacyName: { type: string }
              fromZone: { type: ["string", "null"] }
              toZone: { type: ["string", "null"] }

    DeliveryCoverageZone:
      type: object
      required: [name, boundary]
      properties:
        name: { type: string }
        boundary:
          $ref: "#/components/schemas/ZoneBoundary"

    DeliveryQuoteInput:
      type: object
      required: [pharmacyId, latitude, longitude]
      properties:
        pharmacyId: { type: string }
        latitude: { type: number }
        longitude: { type: number }

    DeliveryQuote:
      type: object
      required: [available, deliveryFeeMinor, zoneName, message]
      properties:
        available: { type: boolean }
        deliveryFeeMinor: { type: ["number", "null"] }
        zoneName: { type: ["string", "null"] }
        message:
          type: ["string", "null"]
          description: Why delivery is unavailable, in words for the patient

    DeliveryLocation:
      type: object
      required: [latitude, longitude]
      properties:
        latitude: { type: number }
        longitude: { type: number }

    PatientOrderInput:
      type: object
      required: [pharmacyId, fulfillmentType, items]
      properties:
        pharmacyId:
          type: string
        fulfillmentType:
          type: string
          enum: [delivery, collection]
        deliveryAddress:
          type: string
          description: For delivery, the landmark or directions for the courier
        deliveryLocation:
          $ref: "#/components/schemas/DeliveryLocation"
        quotedDeliveryFeeMinor:
          type: number
          description: The delivery fee the patient was shown; a different current fee returns 409
        prescriptionImageKey:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/PatientOrderItemInput"

    PilotResetPreview:
      type: object
      required: [confirmationPhrase, totalRows, steps, preserved]
      properties:
        confirmationPhrase:
          type: string
        totalRows:
          type: number
        steps:
          type: array
          items:
            type: object
            required: [table, label, rows]
            properties:
              table: { type: string }
              label: { type: string }
              rows: { type: number }
        preserved:
          type: array
          items: { type: string }

    PilotResetRequest:
      type: object
      required: [confirm]
      properties:
        confirm:
          type: string
          description: Must equal the confirmationPhrase returned by GET.

    PilotResetResult:
      type: object
      required: [deleted, totalRows, images, preserved]
      properties:
        deleted:
          type: object
          additionalProperties: { type: number }
        totalRows:
          type: number
        images:
          type: object
          description: Prescription image files tidied from storage after the transaction committed.
          required: [found, deleted]
          properties:
            found: { type: number }
            deleted: { type: number }
        preserved:
          type: array
          items: { type: string }

    MobileMoneyLine:
      type: object
      description: >
        One mobile money account a pharmacy accepts payment on. The provider is
        display-ready ("Orange Money", "AfriMoney"), never a raw enum value.
      required: [provider, number]
      properties:
        provider:
          type: string
        number:
          type: string

    OrderPharmacyInfo:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        address:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        mobileMoneyLines:
          type: array
          description: Empty when the pharmacy has published no way to be paid.
          items:
            $ref: "#/components/schemas/MobileMoneyLine"
        mobileMoneyNumber:
          type: ["string", "null"]
          deprecated: true
          description: First entry of mobileMoneyLines. Kept for older clients.
        mobileMoneyProvider:
          type: ["string", "null"]
          deprecated: true
          description: First entry of mobileMoneyLines. Kept for older clients.
        mobileMoneyAccountName:
          type: ["string", "null"]

    OrderCourierInfo:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        phone:
          type: ["string", "null"]
        photoUrl:
          type: ["string", "null"]

    OrderPrescriptionInfo:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected]
        rejectReason:
          type: ["string", "null"]

    PharmacyOnlineDay:
      type: object
      required: [date, ordersCount, salesMinor, commissionMinor, receiveMinor, refundedOrders]
      properties:
        date: { type: string }
        ordersCount: { type: number }
        salesMinor: { type: number, description: "At the pharmacy's own prices" }
        commissionMinor: { type: number, description: MobiCare's 5% commission }
        receiveMinor: { type: number, description: What the pharmacy receives }
        refundedOrders: { type: number }

    PharmacyOnlineAnalytics:
      type: object
      required: [enabled, today, daily, waitingMinor, completedMinor]
      properties:
        enabled: { type: boolean }
        today:
          $ref: "#/components/schemas/PharmacyOnlineDay"
        daily:
          type: array
          items:
            $ref: "#/components/schemas/PharmacyOnlineDay"
        waitingMinor:
          type: number
          description: To receive for paid orders not yet delivered or collected
        completedMinor:
          type: number
          description: To receive for completed orders (paid out once payouts start)

    HqOnlineDay:
      type: object
      required: [date, ordersPaid, salesMinor, collectedMinor, refundsCount, refundsMinor, serviceFeesMinor, commissionMinor, deliveryFeesMinor, monimeFeesMinor, netMinor]
      properties:
        date: { type: string }
        ordersPaid: { type: number }
        salesMinor: { type: number, description: "Medicines at the pharmacies' prices, refunded orders left out" }
        collectedMinor: { type: number }
        refundsCount: { type: number }
        refundsMinor: { type: number }
        serviceFeesMinor: { type: number }
        commissionMinor: { type: number }
        deliveryFeesMinor: { type: number }
        monimeFeesMinor: { type: number }
        netMinor: { type: number }

    HqSale:
      type: object
      required: [orderId, paidAt, pharmacyId, pharmacyName, patientName, fulfillmentType, paidMinor, salesMinor, commissionMinor, deliveryFeeMinor, serviceFeeMinor, monimeFeeMinor, revenueMinor, pharmacyReceivesMinor, state]
      properties:
        orderId: { type: string }
        paidAt: { type: string }
        pharmacyId: { type: string }
        pharmacyName: { type: string }
        patientName: { type: string }
        fulfillmentType: { type: string }
        paidMinor: { type: number, description: What the patient paid }
        salesMinor: { type: number, description: "Medicines at the pharmacy's prices" }
        commissionMinor: { type: number }
        deliveryFeeMinor: { type: number }
        serviceFeeMinor: { type: number }
        monimeFeeMinor: { type: number }
        revenueMinor: { type: number, description: "MobiCare's revenue: commission + delivery + service fee - Monime's fee (refunded: minus Monime's fee)" }
        pharmacyReceivesMinor: { type: number }
        state: { type: string, enum: [waiting, completed, paid_to_pharmacy, refunded] }

    HqSalesTrendDay:
      type: object
      required: [date, orders, salesMinor, revenueMinor, commissionMinor, deliveryFeesMinor, serviceFeesMinor, monimeFeesMinor]
      properties:
        date: { type: string }
        orders: { type: number }
        salesMinor: { type: number }
        revenueMinor: { type: number }
        commissionMinor: { type: number }
        deliveryFeesMinor: { type: number }
        serviceFeesMinor: { type: number }
        monimeFeesMinor: { type: number }

    HqSalesTrend:
      type: object
      required: [daily]
      properties:
        daily:
          type: array
          items:
            $ref: "#/components/schemas/HqSalesTrendDay"

    HqSalesTotals:
      type: object
      required: [orders, refundedOrders, salesMinor, commissionMinor, deliveryFeesMinor, serviceFeesMinor, monimeFeesMinor, revenueMinor]
      properties:
        orders: { type: number }
        refundedOrders: { type: number }
        salesMinor: { type: number }
        commissionMinor: { type: number }
        deliveryFeesMinor: { type: number }
        serviceFeesMinor: { type: number }
        monimeFeesMinor: { type: number }
        revenueMinor: { type: number }

    HqSalesHistory:
      type: object
      required: [orders, total, totals]
      properties:
        orders:
          type: array
          items:
            $ref: "#/components/schemas/HqSale"
        total: { type: number }
        totals:
          $ref: "#/components/schemas/HqSalesTotals"

    HqOnlineRefund:
      type: object
      required: [orderId, patientName, pharmacyName, amountMinor, paidAt, reason, payerChannel, payerProvider]
      properties:
        orderId: { type: string }
        patientName: { type: string }
        pharmacyName: { type: ["string", "null"] }
        amountMinor: { type: number }
        paidAt: { type: ["string", "null"] }
        reason: { type: string }
        payerChannel: { type: ["string", "null"] }
        payerProvider: { type: ["string", "null"] }

    HqOnlinePayments:
      type: object
      required: [enabled, today, daily, waitingOnOrdersMinor, owedToPharmaciesMinor, refunds]
      properties:
        enabled: { type: boolean }
        today: { type: string }
        daily:
          type: array
          items:
            $ref: "#/components/schemas/HqOnlineDay"
        waitingOnOrdersMinor: { type: number }
        owedToPharmaciesMinor: { type: number }
        refunds:
          type: array
          items:
            $ref: "#/components/schemas/HqOnlineRefund"

    PharmacyBalance:
      type: object
      required: [availableMinor, releasingMinor, waitingMinor, cashingOutMinor, paidOutMinor, maxCashoutMinor]
      properties:
        availableMinor: { type: number, description: Released and not yet cashed out }
        releasingMinor: { type: number, description: Completed orders whose money is on its way }
        waitingMinor: { type: number, description: Paid orders not yet delivered or collected }
        cashingOutMinor: { type: number, description: Open cash-outs, amount plus fee }
        paidOutMinor: { type: number }
        maxCashoutMinor: { type: number, description: Largest cash-out whose amount plus fee fits }

    PayoutDestination:
      type: object
      required: [provider, network, maskedNumber, usable, problem, availableAt]
      properties:
        provider: { type: string, enum: [m17, m18] }
        network: { type: string }
        maskedNumber: { type: ["string", "null"] }
        usable: { type: boolean }
        problem: { type: ["string", "null"], enum: [no_number, invalid_number, on_hold, null] }
        availableAt: { type: ["string", "null"] }

    PharmacyRelease:
      type: object
      required: [orderId, amountMinor, status, releasedAt, createdAt]
      properties:
        orderId: { type: string }
        amountMinor: { type: number }
        status: { type: string, enum: [released, releasing, nothing_to_release] }
        releasedAt: { type: ["string", "null"] }
        createdAt: { type: string }

    PharmacyCashout:
      type: object
      required: [id, amountMinor, feeMinor, feeIsEstimate, network, maskedNumber, status, needsApproval, failureReason, rejectionReason, createdAt, completedAt]
      properties:
        id: { type: string }
        amountMinor: { type: number, description: What reaches the wallet }
        feeMinor: { type: number, description: "Monime's fee, on top (an estimate until Monime reports it)" }
        feeIsEstimate: { type: boolean }
        network: { type: string }
        maskedNumber: { type: string }
        status: { type: string, enum: [awaiting_approval, sending, pending, processing, completed, failed, rejected, cancelled] }
        needsApproval: { type: boolean }
        failureReason: { type: ["string", "null"] }
        rejectionReason: { type: ["string", "null"] }
        createdAt: { type: string }
        completedAt: { type: ["string", "null"] }

    PharmacyPayouts:
      type: object
      required: [enabled, canCashOut, balance, destinations, feeBasisPoints, minCashoutMinor, approvalThresholdMinor, releases, cashouts]
      properties:
        enabled: { type: boolean }
        canCashOut: { type: boolean }
        balance:
          $ref: "#/components/schemas/PharmacyBalance"
        destinations:
          type: array
          items:
            $ref: "#/components/schemas/PayoutDestination"
        feeBasisPoints: { type: number }
        minCashoutMinor: { type: number }
        approvalThresholdMinor: { type: number }
        releases:
          type: array
          items:
            $ref: "#/components/schemas/PharmacyRelease"
        cashouts:
          type: array
          items:
            $ref: "#/components/schemas/PharmacyCashout"

    CashoutRequest:
      type: object
      required: [amountMinor, provider]
      additionalProperties: false
      properties:
        amountMinor: { type: number, minimum: 1, description: "Whole cents (minor units)" }
        provider: { type: string, enum: [m17, m18] }

    CashoutRejection:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 300 }

    TransferRetry:
      type: object
      required: [transferId, status, attempt]
      properties:
        transferId: { type: string }
        status: { type: string }
        attempt: { type: number }

    HqPharmacyBalance:
      type: object
      required: [pharmacyId, pharmacyName, availableMinor, releasingMinor, waitingMinor, cashingOutMinor, paidOutMinor, maxCashoutMinor]
      properties:
        pharmacyId: { type: string }
        pharmacyName: { type: string }
        availableMinor: { type: number }
        releasingMinor: { type: number }
        waitingMinor: { type: number }
        cashingOutMinor: { type: number }
        paidOutMinor: { type: number }
        maxCashoutMinor: { type: number }

    HqCashout:
      type: object
      required: [id, pharmacyId, pharmacyName, amountMinor, feeMinor, feeIsEstimate, network, maskedNumber, status, needsApproval, failureReason, failureCode, rejectionReason, approvedByName, createdAt, completedAt]
      properties:
        id: { type: string }
        pharmacyId: { type: string }
        pharmacyName: { type: string }
        amountMinor: { type: number }
        feeMinor: { type: number }
        feeIsEstimate: { type: boolean }
        network: { type: string }
        maskedNumber: { type: string }
        status: { type: string }
        needsApproval: { type: boolean }
        failureReason: { type: ["string", "null"] }
        failureCode: { type: ["string", "null"] }
        rejectionReason: { type: ["string", "null"] }
        approvedByName: { type: ["string", "null"] }
        createdAt: { type: string }
        completedAt: { type: ["string", "null"] }

    HqReleaseProblem:
      type: object
      required: [transferId, orderId, kind, amountMinor, pharmacyName, failureCode, failureMessage, failedAt]
      properties:
        transferId: { type: string }
        orderId: { type: string }
        kind: { type: string, enum: [pharmacy_share, mobicare_share] }
        amountMinor: { type: number }
        pharmacyName: { type: string }
        failureCode: { type: ["string", "null"] }
        failureMessage: { type: ["string", "null"] }
        failedAt: { type: string }

    HqPayouts:
      type: object
      required: [enabled, pharmacies, awaitingApproval, recentCashouts, releaseProblems, monimeBalances, approvalThresholdMinor]
      properties:
        enabled: { type: boolean }
        pharmacies:
          type: array
          items:
            $ref: "#/components/schemas/HqPharmacyBalance"
        awaitingApproval:
          type: array
          items:
            $ref: "#/components/schemas/HqCashout"
        recentCashouts:
          type: array
          items:
            $ref: "#/components/schemas/HqCashout"
        releaseProblems:
          type: array
          items:
            $ref: "#/components/schemas/HqReleaseProblem"
        monimeBalances:
          type: object
          required: [holdingMinor, mobicareShareMinor]
          properties:
            holdingMinor: { type: ["number", "null"], description: "Monime's own balance for the Holding account" }
            mobicareShareMinor: { type: number, description: "MobiCare's share of completed orders (commission, delivery, service fee, less Monime's fee), kept in Holding" }
        approvalThresholdMinor: { type: number }

    PaymentsConfig:
      type: object
      required: [provider, serviceFeeBasisPoints, available]
      properties:
        provider:
          type: string
          enum: [monime, direct]
        serviceFeeBasisPoints:
          type: number
          description: The patient service fee rate (200 = 2%).
        available:
          type: boolean
          description: False while Monime can't be reached.

    CheckoutLink:
      type: object
      required: [status, redirectUrl, expireTime]
      properties:
        status:
          type: string
          enum: [pending, paid]
        redirectUrl:
          type: ["string", "null"]
        expireTime:
          type: ["string", "null"]

    OrderPayment:
      type: object
      required: [orderStatus, paymentProvider, paid, latePaymentStatus, payableSince, payBy, link]
      properties:
        orderStatus:
          type: string
        paymentProvider:
          type: string
        paid:
          type: boolean
        latePaymentStatus:
          type: ["string", "null"]
        payableSince:
          type: ["string", "null"]
        payBy:
          type: ["string", "null"]
          description: When the payment window closes.
        link:
          oneOf:
            - $ref: "#/components/schemas/OrderPaymentLink"
            - type: "null"

    OrderPaymentLink:
      type: object
      required: [status, redirectUrl, expireTime]
      properties:
        status:
          type: string
          description: creating, pending, completed, expired, cancelled, deleted or failed
        redirectUrl:
          type: ["string", "null"]
        expireTime:
          type: ["string", "null"]

    PatientOrder:
      allOf:
        - $ref: "#/components/schemas/Order"
        - type: object
          properties:
            deliveryAddress:
              type: ["string", "null"]
            deliveryZoneName:
              type: ["string", "null"]
            paymentMethod:
              type: string
            pharmacy:
              oneOf:
                - $ref: "#/components/schemas/OrderPharmacyInfo"
                - type: "null"
            courier:
              oneOf:
                - $ref: "#/components/schemas/OrderCourierInfo"
                - type: "null"
            prescription:
              oneOf:
                - $ref: "#/components/schemas/OrderPrescriptionInfo"
                - type: "null"

    PrescriptionUploadInput:
      type: object
      required: [image]
      properties:
        image:
          type: string
          description: Base64 data URL (PNG, JPEG, or WebP, max 5 MB)

    PrescriptionUploadResponse:
      type: object
      required: [imageKey]
      properties:
        imageKey:
          type: string

    # ── Inventory schemas ──────────────────────────────────────────────────
    DrugSummary:
      type: object
      required: [name, tier, unit, commonStrengths, commonForms]
      properties:
        name:
          type: string
        genericName:
          type: ["string", "null"]
        tier:
          type: string
          enum: ["1", "2", "3"]
        unit:
          type: string
        commonStrengths:
          type: array
          items:
            type: string
        commonForms:
          type: array
          items:
            type: string
        variants:
          description: >-
            The strength + form combinations the medicine comes in. Empty
            means every listed strength comes in every listed form.
          type: array
          items:
            $ref: "#/components/schemas/DrugVariant"
        primaryCategory:
          oneOf:
            - $ref: "#/components/schemas/DrugPrimaryCategory"
            - type: "null"
        subcategory:
          oneOf:
            - $ref: "#/components/schemas/DrugSubcategory"
            - type: "null"

    SpreadsheetFile:
      type: object
      required: [fileName, mimeType, contentBase64]
      properties:
        fileName: { type: string }
        mimeType: { type: string }
        contentBase64: { type: string }
    SpreadsheetUpload:
      type: object
      required: [fileName, contentBase64]
      properties:
        fileName: { type: string }
        contentBase64:
          type: string
          description: "The .xlsx or .csv file, base64-encoded (a data URL is accepted). At most 5 MB."
    SpreadsheetApply:
      type: object
      required: [fileName, contentBase64]
      properties:
        fileName: { type: string }
