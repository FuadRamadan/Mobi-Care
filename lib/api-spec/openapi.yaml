openapi: 3.1.0
info:
  title: Api
  version: 0.2.0
  description: MobiCare Pharmacy Portal API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: orders
    description: Pharmacy orders
  - name: inventory
    description: Pharmacy inventory
  - name: catalogue
    description: Drug catalogue
  - name: prescriptions
    description: Prescription management
  - name: notifications
    description: Pharmacy notifications
  - name: analytics
    description: Dashboard analytics
  - name: hq
    description: MobiCare HQ oversight (HQ role required)

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Auth ──────────────────────────────────────────────────────────────────
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with identifier and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Token pair and user info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials

  /auth/refresh:
    post:
      operationId: refreshToken
      tags: [auth]
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshInput"
      responses:
        "200":
          description: New token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"

  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change password (authenticated)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Invalidate refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshInput"
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # ── Orders ────────────────────────────────────────────────────────────────
  /pharmacy/orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List orders for this pharmacy
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of orders with items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"

  /pharmacy/orders/{id}/status:
    patch:
      operationId: updateOrderStatus
      tags: [orders]
      summary: Advance order status (confirmed / packaging / ready)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
  
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusUpdate"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "409":
          description: Invalid status transition

  /pharmacy/orders/{id}/collected:
    post:
      operationId: markOrderCollected
      tags: [orders]
      summary: Mark order collected (in-person ID checked)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
  
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectedConfirmation"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /pharmacy/orders/{id}/picked-up:
    post:
      operationId: markOrderPickedUp
      tags: [orders]
      summary: Mark order picked up by courier
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
  
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  # ── Inventory ─────────────────────────────────────────────────────────────
  /pharmacy/inventory:
    get:
      operationId: listInventory
      tags: [inventory]
      summary: List this pharmacy's inventory listings
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Inventory listings with drug info
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryItem"

    post:
      operationId: addInventoryItem
      tags: [inventory]
      summary: Add a drug listing to inventory
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryInput"
      responses:
        "201":
          description: Created listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"

  /pharmacy/inventory/{id}:
    patch:
      operationId: updateInventoryItem
      tags: [inventory]
      summary: Update price, stock, or availability
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
  
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryUpdate"
      responses:
        "200":
          description: Updated listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"

    delete:
      operationId: deleteInventoryItem
      tags: [inventory]
      summary: Remove a drug listing
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
  
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # ── Catalogue ─────────────────────────────────────────────────────────────
  /pharmacy/catalogue:
    get:
      operationId: listCatalogue
      tags: [catalogue]
      summary: List approved drugs in the master catalogue
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Catalogue drugs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DrugCatalogueItem"

    post:
      operationId: proposeDrug
      tags: [catalogue]
      summary: Propose a new drug (held for HQ approval)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DrugProposal"
      responses:
        "202":
          description: Proposal submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DrugCatalogueItem"

  # ── Prescriptions ─────────────────────────────────────────────────────────
  /pharmacy/prescriptions:
    get:
      operationId: listPrescriptions
      tags: [prescriptions]
      summary: List prescriptions for this pharmacy
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Prescriptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Prescription"

  /pharmacy/prescriptions/{id}:
    get:
      operationId: getPrescription
      tags: [prescriptions]
      summary: Get a single prescription
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
  
      responses:
        "200":
          description: Prescription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prescription"

  /pharmacy/prescriptions/{id}/approve:
    post:
      operationId: approvePrescription
      tags: [prescriptions]
      summary: Approve prescription (subset of drugs)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
  
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrescriptionApproval"
      responses:
        "200":
          description: Approved prescription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prescription"

  /pharmacy/prescriptions/{id}/reject:
    post:
      operationId: rejectPrescription
      tags: [prescriptions]
      summary: Reject prescription with a reason from a fixed enum
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
  
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrescriptionRejection"
      responses:
        "200":
          description: Rejected prescription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prescription"

  /pharmacy/prescriptions/{id}/image-url:
    post:
      operationId: getPrescriptionImageUrl
      tags: [prescriptions]
      summary: Mint a short-lived signed URL for the prescription image
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
  
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageUrlRequest"
      responses:
        "200":
          description: Signed image URL (15 min TTL)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageUrlResponse"

  # ── Notifications ─────────────────────────────────────────────────────────
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List all notifications
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"

  /notifications/unread-count:
    get:
      operationId: getUnreadCount
      tags: [notifications]
      summary: Get unread notification count
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Unread count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadCount"

  /notifications/mark-read:
    post:
      operationId: markNotificationsRead
      tags: [notifications]
      summary: Mark notifications as read
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkReadInput"
      responses:
        "200":
          description: Marked as read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # ── Analytics ─────────────────────────────────────────────────────────────
  /pharmacy/analytics/overview:
    get:
      operationId: getAnalyticsOverview
      tags: [analytics]
      summary: Dashboard overview — order counts, revenue, pending work
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Analytics overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsOverview"

  /pharmacy/analytics/orders-by-day:
    get:
      operationId: getOrdersByDay
      tags: [analytics]
      summary: Orders and revenue grouped by day (last 30 days)
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Daily order data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DailyOrderStat"

  # ── HQ ────────────────────────────────────────────────────────────────────
  /hq/dashboard:
    get:
      operationId: getHqDashboard
      tags: [hq]
      summary: HQ command centre — aggregates, live feed, revenue
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HqDashboard"

  /hq/orders:
    get:
      operationId: listHqOrders
      tags: [hq]
      summary: All orders across all pharmacies
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HqOrder"

  /hq/orders/dispatch:
    get:
      operationId: listDispatchOrders
      tags: [hq]
      summary: Delivery orders in the dispatch pipeline
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Dispatch orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HqOrder"

  /hq/orders/{id}/assign-courier:
    post:
      operationId: assignCourier
      tags: [hq]
      summary: Assign a courier to a ready delivery order
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignCourierInput"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HqOrder"
        "409":
          description: Invalid state

  /hq/orders/{id}/courier-status:
    patch:
      operationId: updateCourierStatus
      tags: [hq]
      summary: Advance courier status (delivering / delivered)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourierStatusUpdate"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HqOrder"
        "409":
          description: Invalid transition

  /hq/orders/{id}/cash-collected:
    post:
      operationId: markCashCollected
      tags: [hq]
      summary: Reconcile cash-on-delivery for a delivered order
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HqOrder"
        "409":
          description: Invalid state

  /hq/pharmacies:
    get:
      operationId: listHqPharmacies
      tags: [hq]
      summary: All pharmacies
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Pharmacies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HqPharmacy"
    post:
      operationId: onboardPharmacy
      tags: [hq]
      summary: Onboard a pharmacy (returns one-time temp password)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PharmacyOnboardInput"
      responses:
        "201":
          description: Created pharmacy with temp password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PharmacyOnboardResponse"
        "409":
          description: Username taken

  /hq/pharmacies/{id}:
    patch:
      operationId: updateHqPharmacy
      tags: [hq]
      summary: Licence verification, Tier-1 gate, online/offline status
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HqPharmacyUpdate"
      responses:
        "200":
          description: Updated pharmacy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HqPharmacy"

  /hq/drugs:
    get:
      operationId: listHqDrugs
      tags: [hq]
      summary: Master catalogue (filter by held/approved)
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [held, approved]
      responses:
        "200":
          description: Drugs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HqDrug"
    post:
      operationId: createHqDrug
      tags: [hq]
      summary: Add a drug to the master catalogue
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HqDrugInput"
      responses:
        "201":
          description: Created drug
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HqDrug"

  /hq/drugs/{id}:
    patch:
      operationId: updateHqDrug
      tags: [hq]
      summary: Change tier / cap, or release a held drug
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HqDrugUpdate"
      responses:
        "200":
          description: Updated drug
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HqDrug"

  /hq/couriers:
    get:
      operationId: listCouriers
      tags: [hq]
      summary: Courier fleet with live delivery load
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Couriers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Courier"
    post:
      operationId: createCourier
      tags: [hq]
      summary: Add a courier
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourierInput"
      responses:
        "201":
          description: Created courier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Courier"

  /hq/couriers/{id}:
    patch:
      operationId: updateCourier
      tags: [hq]
      summary: Edit or activate/deactivate a courier
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourierUpdate"
      responses:
        "200":
          description: Updated courier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Courier"

  /hq/flags:
    get:
      operationId: listFlags
      tags: [hq]
      summary: Fraud/anomaly flags queue
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, reviewed]
      responses:
        "200":
          description: Flags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HqFlag"

  /hq/flags/{id}/review:
    post:
      operationId: reviewFlag
      tags: [hq]
      summary: Mark a flag reviewed with a note
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlagReviewInput"
      responses:
        "200":
          description: Reviewed flag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HqFlag"

  /hq/settlements:
    get:
      operationId: listSettlements
      tags: [hq]
      summary: Pharmacy and courier settlements
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Settlements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettlementsResponse"

  /hq/settlements/generate:
    post:
      operationId: generateSettlements
      tags: [hq]
      summary: Generate pending settlements for a period
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateSettlementsInput"
      responses:
        "201":
          description: Settlements generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /hq/settlements/{id}/mark-paid:
    post:
      operationId: markSettlementPaid
      tags: [hq]
      summary: Mark a settlement as paid
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkPaidInput"
      responses:
        "200":
          description: Paid settlement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settlement"
        "409":
          description: Already paid

  /hq/audit:
    get:
      operationId: listAuditLog
      tags: [hq]
      summary: Append-only audit log (read-only, filterable by entity)
      security:
        - BearerAuth: []
      parameters:
        - name: entityType
          in: query
          required: false
          schema:
            type: string
        - name: entityId
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: number
      responses:
        "200":
          description: Audit entries, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEntry"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    # ── Auth schemas ───────────────────────────────────────────────────────
    LoginInput:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
          description: Username or phone number
        password:
          type: string

    RefreshInput:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    ChangePasswordInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8

    PharmacyUser:
      type: object
      required: [id, role, name, username]
      properties:
        id:
          type: string

        role:
          type: string
          enum: [pharmacy, hq]
        name:
          type: string
        username:
          type: string
        phone:
          type: ["string", "null"]
        controlledSubstanceAuthorized:
          type: boolean
          description: Present for pharmacy accounts only
        mustChangePassword:
          type: boolean
          description: Pharmacy accounts onboarded with a temp password must change it before using the portal API

