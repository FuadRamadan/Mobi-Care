    SavedApiPair:
      type: object
      required: [key, value]
      description: Pair values are encrypted at rest. Responses return eight bullets for non-empty values and an empty string for empty values. On update, the eight-bullet mask preserves the next existing value with the same key.
      properties:
        key: { type: string, maxLength: 200 }
        value:
          type: string
          maxLength: 8000
          description: Plaintext replacement on create/update, or the fixed mask "••••••••" to preserve an existing same-key value. Never returned as plaintext.
