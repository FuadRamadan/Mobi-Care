        url: { type: string, maxLength: 2000 }
        method: { type: string, enum: [GET, POST, PUT, PATCH, DELETE, HEAD] }
        authType: { type: string, enum: [none, basic, bearer, api-key-header] }
        auth:
          type: object
          properties:
            username: { type: string, maxLength: 500 }
            headerName: { type: string, maxLength: 200 }
            secret: { type: string, writeOnly: true, maxLength: 8000 }
        params: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/SavedApiPair" } }
        headers: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/SavedApiPair" } }
        body: { type: ["string", "null"], maxLength: 65536 }
