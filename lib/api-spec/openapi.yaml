          type: string
        patientPhone:
          type: string
        status:
          type: string
          enum: [awaiting_payment, paid, confirmed, packaging, ready, assigned, picked_up, delivering, delivered, collected, cancelled]
        fulfillmentType:
          type: string
          enum: [delivery, collection]
        idChecked:
          type: boolean
        totalLeones:
          type: number
        prescriptionId:
          type: ["string", "null"]

        createdAt:
          type: string

        updatedAt:
          type: string

        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"

