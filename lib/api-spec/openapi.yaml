        [
          totalOrders,
          pendingOrders,
          revenueLeones,
          pendingPrescriptions,
          lowStockItems,
          ordersByStatus,
        ]
      properties:
        totalOrders:
          type: number
        pendingOrders:
          type: number
          description: Orders needing pharmacy action (paid, confirmed, packaging)
        revenueLeones:
          type: number
          description: Total revenue from completed orders
        pendingPrescriptions:
          type: number
        lowStockItems:
          type: number
          description: Inventory items with stockQuantity <= 5
        ordersByStatus:
          type: object
          additionalProperties:
            type: number

    DailyOrderStat:
      type: object
      required: [date, orders, revenueLeones]
      properties:
        date:
          type: string

        orders:
          type: number
        revenueLeones:
          type: number

    # ── HQ schemas ─────────────────────────────────────────────────────────
    HqNotification:
      type: object
      required: [id, hqStaffId, title, body, createdAt]
      properties:
        id:
          type: string
        hqStaffId:
          type: string
        title:
          type: string
        body:
          type: string
        type:
          type: ["string", "null"]
        referenceId:
          type: ["string", "null"]
        readAt:
          type: ["string", "null"]
        createdAt:
          type: string

    HqDashboard:
      type: object
      required: [totals, ordersByStatus, recentOrders]
      properties:
        totals:
          type: object
          required:
            [
              orders,
              ordersToday,
              pharmacies,
              activePharmacies,
              couriers,
              activeCouriers,
              openFlags,
              heldDrugs,
              pendingSettlements,
              awaitingDispatch,
              confirmedRevenueLeones,
            ]
          properties:
            orders:
              type: number
            ordersToday:
              type: number
            pharmacies:
              type: number
            activePharmacies:
              type: number
            couriers:
              type: number
            activeCouriers:
              type: number
            openFlags:
              type: number
            heldDrugs:
              type: number
            pendingSettlements:
              type: number
            awaitingDispatch:
              type: number
            confirmedRevenueLeones:
              type: number
        ordersByStatus:
          type: array
          items:
            type: object
            required: [status, count]
            properties:
              status:
                type: string
              count:
                type: number
        recentOrders:
          type: array
          items:
            type: object
            required:
              [id, status, fulfillmentType, totalLeones, patientName, createdAt]
            properties:
              id:
                type: string
              status:
                type: string
              fulfillmentType:
                type: string
              totalLeones:
                type: number
              patientName:
                type: string
              pharmacyName:
                type: ["string", "null"]
              createdAt:
                type: string

    HqCourierSummary:
      type: object
      required: [id, name, phone]
      properties:
        id:
          type: string
        name:
          type: string
        phone:
          type: string

    HqOrder:
      type: object
      required:
        [
          id,
          pharmacyId,
          patientName,
          patientPhone,
          status,
          fulfillmentType,
          idChecked,
          totalLeones,
          cashCollected,
          paymentMethod,
          createdAt,
          updatedAt,
          items,
        ]
      properties:
        id:
          type: string
        pharmacyId:
          type: string
        pharmacyName:
          type: ["string", "null"]
        patientName:
          type: string
        patientPhone:
          type: string
        status:
          type: string
          enum:
            [
              awaiting_payment,
              paid,
              confirmed,
              packaging,
              ready,
              assigned,
              picked_up,
              delivering,
              delivered,
              collected,
              cancelled,
            ]
        fulfillmentType:
          type: string
          enum: [delivery, collection]
        idChecked:
          type: boolean
        totalLeones:
          type: number
        prescriptionId:
          type: ["string", "null"]
        courierId:
          type: ["string", "null"]
        courier:
          oneOf:
            - $ref: "#/components/schemas/HqCourierSummary"
            - type: "null"
        cashCollected:
          type: boolean
        cashCollectedAt:
          type: ["string", "null"]
        paymentMethod:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"

    AssignCourierInput:
      type: object
      required: [courierId]
      properties:
        courierId:
          type: string

    CourierStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [delivering]

    HqPharmacy:
      type: object
      required:
        [
          id,
          name,
          username,
          isActive,
          controlledSubstanceAuthorized,
          mustChangePassword,
          sessionVersion,
          passwordLastChangedAt,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
        name:
          type: string
        username:
          type: string
        phone:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        locationLat:
          type: ["string", "null"]
        locationLng:
          type: ["string", "null"]
        isActive:
          type: boolean
        controlledSubstanceAuthorized:
          type: boolean
        mustChangePassword:
          type: boolean
        sessionVersion:
          type: number
        passwordLastChangedAt:
          type: string
        temporaryPasswordExpiresAt:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string

    PharmacyOnboardInput:
      type: object
      required: [name, username]
      properties:
        name:
          type: string
          minLength: 1
        username:
          type: string
          minLength: 3
        phone:
          type: string
        address:
          type: string

    PharmacyOnboardResponse:
      type: object
      required: [pharmacy, tempPassword, temporaryPasswordExpiresAt]
      properties:
        pharmacy:
          $ref: "#/components/schemas/HqPharmacy"
        tempPassword:
          type: string
          description: Shown once — store it securely and hand it to the pharmacy
        temporaryPasswordExpiresAt:
          type: string
          description: ISO timestamp when the temporary password expires

    PharmacyResetPasswordResponse:
      type: object
      required: [tempPassword, temporaryPasswordExpiresAt, pharmacy]
      properties:
        tempPassword:
          type: string
          description: Shown once — hand it to the pharmacy immediately; it is not stored in plaintext
        temporaryPasswordExpiresAt:
          type: string
          description: ISO timestamp when the temporary password expires
        pharmacy:
          $ref: "#/components/schemas/HqPharmacy"

    PasswordPolicy:
      type: object
      required:
        [
          id,
          maxPasswordAgeDays,
          passwordExpiryWarningDays,
          minPasswordLength,
          requireUppercase,
          requireLowercase,
          requireNumber,
          requireSymbol,
          passwordHistoryCount,
          temporaryPasswordExpiryHours,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: number
        maxPasswordAgeDays:
          type: number
          description: Number of days before a password must be changed
        passwordExpiryWarningDays:
          type: number
          description: Number of days before expiry when pharmacies may proactively change their password
        minPasswordLength:
          type: number
          description: Minimum number of characters required
        requireUppercase:
          type: boolean
        requireLowercase:
          type: boolean
        requireNumber:
          type: boolean
        requireSymbol:
          type: boolean
        passwordHistoryCount:
          type: number
          description: Number of previous passwords that cannot be reused
        temporaryPasswordExpiryHours:
          type: number
          description: Hours until a temporary password expires
        createdAt:
          type: string
        updatedAt:
          type: string

    PasswordPolicyUpdate:
      type: object
      properties:
        maxPasswordAgeDays:
          type: number
          minimum: 1
          maximum: 365
        passwordExpiryWarningDays:
          type: number
          minimum: 1
          maximum: 30
        minPasswordLength:
          type: number
          minimum: 8
          maximum: 128
        requireUppercase:
          type: boolean
        requireLowercase:
          type: boolean
        requireNumber:
          type: boolean
        requireSymbol:
          type: boolean
        passwordHistoryCount:
          type: number
          minimum: 0
          maximum: 24
        temporaryPasswordExpiryHours:
          type: number
          minimum: 1
          maximum: 168

    OrangeSmsConnection:
      type: object
      required:
        [
          provider,
          displayName,
          credentialsConfigured,
          senderConfigured,
          connectionStatus,
          isEnabled,
        ]
      properties:
        provider:
          type: string
          enum: [orange_sl]
        displayName:
          type: string
        credentialsConfigured:
          type: boolean
        senderConfigured:
          type: boolean
        connectionStatus:
          type: string
          enum: [not_configured, incomplete, ready]
        senderAddress:
          type: ["string", "null"]
        senderName:
          type: ["string", "null"]
        isEnabled:
          type: boolean
        lastTestedAt:
          type: ["string", "null"]
        lastTestStatus:
          type: ["string", "null"]
          enum: [success, failed, null]
        lastTestMessage:
          type: ["string", "null"]
        updatedAt:
          type: ["string", "null"]

    OrangeSmsConnectionUpdate:
      type: object
      required: [isEnabled]
      properties:
        clientId:
          type: string
          minLength: 1
          maxLength: 500
          description: Omit to preserve the saved encrypted client ID
        clientSecret:
          type: string
          minLength: 1
          maxLength: 1000
          description: Omit to preserve the saved encrypted client secret
        senderAddress:
          type: ["string", "null"]
          pattern: "^\\+[1-9][0-9]{4,19}$"
        senderName:
          type: ["string", "null"]
          pattern: "^[A-Za-z0-9 ]{1,11}$"
        isEnabled:
          type: boolean

    OrangeSmsTestInput:
      type: object
      required: [phone]
      properties:
        phone:
          type: string
          pattern: "^\\+[1-9][0-9]{4,19}$"

    OrangeSmsTestResult:
      type: object
      required: [success, message, testedAt]
      properties:
        success:
          type: boolean
        message:
          type: string
        providerMessageId:
          type: ["string", "null"]
        testedAt:
          type: string

    SavedApiPair:
      type: object
      required: [key, value]
      description: Pair values are encrypted at rest. Responses return eight bullets for non-empty values and an empty string for empty values. On update, the eight-bullet mask preserves the next existing value with the same key.
      properties:
        key: { type: string, maxLength: 200 }
        value:
          type: string
          maxLength: 8000
          description: Plaintext replacement on create/update, or the fixed mask "••••••••" to preserve an existing same-key value. Never returned as plaintext.
    SavedApiRequestInput:
      type: object
      required: [name, url, method]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        url: { type: string, maxLength: 2000 }
        method: { type: string, enum: [GET, POST, PUT, PATCH, DELETE, HEAD] }
        authType: { type: string, enum: [none, basic, bearer, api-key-header] }
        auth:
          type: object
          properties:
            username: { type: string, maxLength: 500 }
            headerName: { type: string, maxLength: 200 }
            secret: { type: string, writeOnly: true, maxLength: 8000 }
        params: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/SavedApiPair" } }
        headers: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/SavedApiPair" } }
        body: { type: ["string", "null"], maxLength: 65536 }
    SavedApiRequest:
      allOf:
        - $ref: "#/components/schemas/SavedApiRequestInput"
        - type: object
          required: [id, authConfigured, createdAt, updatedAt]
          properties:
            id: { type: string }
            authConfigured: { type: boolean }
            auth: { type: ["object", "null"], properties: { secret: { type: string, readOnly: true } } }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    SavedApiExecution:
      type: object
      required: [status, durationMs, headers, body]
      properties:
        status: { type: number }
        durationMs: { type: number }
        headers: { type: object, additionalProperties: { type: string } }
        body: { type: ["string", "null"] }
    SavedApiRequestHistory:
      type: object
      properties:
        id: { type: string }
        requestId: { type: string }
        method: { type: string }
        url: { type: string }
        status: { type: ["number", "null"] }
