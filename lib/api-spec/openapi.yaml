        manufacturer:
          type: string
        countryOfOrigin:
          type: string
        strength:
          type: string
          minLength: 1
        form:
          type: string
          minLength: 1
        unitOfSale:
          type: string
          minLength: 1
        expiryDate:
          type: string
        primaryCategory:
          oneOf:
            - $ref: "#/components/schemas/DrugPrimaryCategory"
            - type: "null"
        subcategory:
          oneOf:
            - $ref: "#/components/schemas/DrugSubcategory"
            - type: "null"
        otherCategoryText:
          type: ["string", "null"]
        priceLeones:
          type: number
          minimum: 1
        stockQuantity:
          type: number
          minimum: 0
        lowStockAlertAt:
          type: number
          minimum: 0
        availableForDelivery:
          type: boolean
        availableForCollection:
          type: boolean
        isActive:
          type: boolean

    # ── Catalogue schemas ──────────────────────────────────────────────────
    DrugCatalogueItem:
      type: object
      required:
        [
          id,
          name,
          tier,
          unit,
          commonStrengths,
          commonForms,
          variants,
          isApproved,
          reviewStatus,
          createdAt,
        ]
      properties:
        id:
          type: string

        name:
          type: string
        genericName:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        tier:
          type: string
          enum: ["1", "2", "3"]
        unit:
          type: string
        commonStrengths:
          type: array
          items:
            type: string
        commonForms:
          type: array
          items:
            type: string
        variants:
          description: >-
            The strength + form combinations the medicine comes in. Empty
            means every listed strength comes in every listed form.
          type: array
          items:
            $ref: "#/components/schemas/DrugVariant"
        primaryCategory:
          oneOf:
            - $ref: "#/components/schemas/DrugPrimaryCategory"
            - type: "null"
        subcategory:
          oneOf:
            - $ref: "#/components/schemas/DrugSubcategory"
            - type: "null"
        isApproved:
          type: boolean
        reviewStatus:
          type: string
          enum: [pending, approved, rejected]
        rejectionReason:
          type: ["string", "null"]
        reviewedAt:
          type: ["string", "null"]
        reviewDueAt:
          type: string
        createdAt:
          type: string

    DrugProposal:
      type: object
      required:
        [
          name,
          genericName,
          strength,
          form,
          suggestedCategory,
          suggestedSubcategory,
        ]
      properties:
        name:
          type: string
          minLength: 2
        genericName:
          type: string
          minLength: 2
        strength:
          type: string
          minLength: 1
        form:
          type: string
          minLength: 1
        suggestedCategory:
          $ref: "#/components/schemas/DrugPrimaryCategory"
        suggestedSubcategory:
          $ref: "#/components/schemas/DrugSubcategory"
        description:
          type: string
        unit:
          type: string

    DrugPrimaryCategory:
      type: string
      enum:
        [
          cardiovascular,
          pain_inflammation,
          anti_infectives,
          gastrointestinal_nutrition,
          endocrine_reproductive,
          respiratory_allergy,
          psychiatric_mental_health,
          blood_products_plasma_expanders,
          antidotes_poisoning,
          cancer_immunosuppressants,
          vaccines_immunologicals,
          eye_preparations,
          skin_preparations,
          ear_nose_throat,
        ]

    DrugSubcategory:
      type: string
      enum:
        [
          antihypertensives, antianginals, anticoagulants, lipid_lowering, diuretics,
          analgesics_antipyretics,
          anti_inflammatory,
          anaesthetics, muscle_relaxants, gout_medicines,
          antibiotics,
          antimalarials,
          antifungals, antivirals, antiparasitics,
          antacids_antiulcer, antiemetics, laxatives, antidiarrheals_ors,
          vitamins_minerals,
          diabetes, thyroid_medicines, corticosteroids, contraceptives, maternal_health,
          asthma_copd,
          cough_cold,
          antihistamines, nasal_preparations, respiratory_other,
          controlled_sedatives, antidepressants, antipsychotics, antiepileptics,
          neurological_medicines,
          blood_products, plasma_expanders, human_albumin, haematinics,
          other,
          heart_failure_arrhythmia_shock, antispasmodics, hormones,
          chelating_agents, diluents_iv_preparation,
          antidotes, adsorbents,
          antineoplastics, immunosuppressants,
          vaccines, antisera, immunoglobulins,
          glaucoma_medicines, mydriatics, eye_combinations,
          antiseptics, emollients, keratolytics,
          ear_preparations, mouth_throat,
        ]

    DrugSubcategoryOption:
      type: object
      required: [value, label]
      properties:
        value:
          $ref: "#/components/schemas/DrugSubcategory"
        label:
          type: string

    DrugCategory:
      type: object
      required: [value, label, subcategories]
      properties:
        value:
          $ref: "#/components/schemas/DrugPrimaryCategory"
        label:
          type: string
        subcategories:
          type: array
          items:
            $ref: "#/components/schemas/DrugSubcategoryOption"

    # ── Prescription schemas ───────────────────────────────────────────────
    Prescription:
      type: object
      required:
        [
          id,
          pharmacyId,
          patientName,
          patientPhone,
          status,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string

        pharmacyId:
          type: string

        patientName:
          type: string
        patientPhone:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected]
        approvedDrugIds:
          type: ["array", "null"]
          items:
            type: string

        rejectReason:
          type: ["string", "null"]
          enum:
            - illegible_image
            - expired_prescription
            - invalid_prescription
            - drug_unavailable
            - controlled_substance_not_authorized
            - patient_mismatch
            - quantity_exceeded
            - "null"
        rejectNote:
          type: ["string", "null"]
        reviewedAt:
          type: ["string", "null"]

        orderId:
          type: ["string", "null"]

        createdAt:
          type: string

        updatedAt:
          type: string

    PrescriptionApproval:
      type: object
      required: [approvedDrugIds]
      properties:
        approvedDrugIds:
          type: array
          items:
            type: string

          minItems: 1

    PrescriptionRejection:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          enum:
            - illegible_image
            - expired_prescription
            - invalid_prescription
            - drug_unavailable
            - controlled_substance_not_authorized
            - patient_mismatch
            - quantity_exceeded
        note:
          type: string

    ImageUrlRequest:
      type: object
      properties:
        variant:
          type: string
          enum: [preview, full]

    ImageUrlResponse:
      type: object
      required: [url, expiresAt]
      properties:
        url:
          type: string
        expiresAt:
          type: string

        note:
          type: ["string", "null"]

    # ── Notification schemas ───────────────────────────────────────────────
    Notification:
      type: object
      required: [id, pharmacyId, title, body, createdAt]
      properties:
        id:
          type: string

        pharmacyId:
          type: string

        title:
          type: string
        body:
          type: string
        type:
          type: ["string", "null"]
        referenceId:
          type: ["string", "null"]

        readAt:
          type: ["string", "null"]

        createdAt:
          type: string

    UnreadCount:
      type: object
      required: [unreadCount]
      properties:
        unreadCount:
          type: number

    MarkReadInput:
      type: object
      properties:
        ids:
          type: array
          items:
            type: string

    PushTokenInput:
      type: object
      required: [expoPushToken]
      properties:
        expoPushToken:
          type: string
          nullable: true
          description: Expo push token for the device, or null to disable push

    # ── Analytics schemas ──────────────────────────────────────────────────
    AnalyticsOverview:
      type: object
      required:
        [
          totalOrders,
          pendingOrders,
          revenueLeones,
          dailyRevenueLeones,
          pendingPrescriptions,
          lowStockItems,
          ordersByStatus,
        ]
      properties:
        totalOrders:
          type: number
        pendingOrders:
          type: number
          description: Orders needing pharmacy action (paid, confirmed, packaging)
        revenueLeones:
          type: number
          description: Pharmacy earnings from completed orders
        dailyRevenueLeones:
          type: number
          description: Today's pharmacy earnings from completed orders
        pendingPrescriptions:
          type: number
        lowStockItems:
          type: number
          description: Inventory items with stockQuantity <= 5
        ordersByStatus:
          type: object
          additionalProperties:
            type: number

    DailyOrderStat:
      type: object
      required: [date, orders, revenueLeones]
      properties:
        date:
          type: string

        orders:
          type: number
        revenueLeones:
          type: number

    # ── HQ schemas ─────────────────────────────────────────────────────────
    HqNotification:
      type: object
      required: [id, hqStaffId, title, body, createdAt]
      properties:
        id:
          type: string
        hqStaffId:
          type: string
        title:
          type: string
        body:
          type: string
        type:
          type: ["string", "null"]
        referenceId:
          type: ["string", "null"]
        readAt:
          type: ["string", "null"]
        createdAt:
          type: string

    HqInsights:
      type: object
      required: [minimumGroupSize, dateRange, totals, trends, rankings, suppression]
      properties:
        minimumGroupSize: { type: number, minimum: 10 }
        dateRange:
          type: object
          additionalProperties: true
        totals:
          type: object
          additionalProperties:
            type: [number, "null"]
        trends:
          type: object
          additionalProperties:
            type: array
            items:
              type: object
              additionalProperties: true
        rankings:
          type: object
          additionalProperties:
            type: array
            items:
              type: object
              additionalProperties: true
        suppression:
          type: object
          additionalProperties:
            type: string
          description: Per-metric explanation of minimum-cohort suppression. Totals are null when their own cohort is below 10; trend and ranking buckets below 10 are omitted.

    HqDashboard:
      type: object
      required: [totals, ordersByStatus, recentOrders]
      properties:
        totals:
          type: object
          required:
            [
              orders,
              ordersToday,
              pharmacies,
              activePharmacies,
              couriers,
              activeCouriers,
              openFlags,
              heldDrugs,
              pendingSettlements,
              awaitingDispatch,
              pendingPrescriptions,
              unconfirmedDeliveries,
              completedRevenueLeones,
            ]
          properties:
            orders:
              type: number
            ordersToday:
              type: number
            pharmacies:
              type: number
            activePharmacies:
              type: number
            couriers:
              type: number
            activeCouriers:
              type: number
            openFlags:
              type: number
            heldDrugs:
              type: number
            pendingSettlements:
              type: number
            awaitingDispatch:
              type: number
            pendingPrescriptions:
              type: number
            unconfirmedDeliveries:
              type: number
            completedRevenueLeones:
              type: number
              description: Sum of orders in delivered or collected status with a completed_at timestamp.
        ordersByStatus:
          type: array
          items:
            type: object
            required: [status, count]
            properties:
              status:
                type: string
              count:
                type: number
        recentOrders:
          type: array
          items:
            type: object
            required:
              [id, status, fulfillmentType, totalLeones, patientName, createdAt]
            properties:
              id:
                type: string
              status:
                type: string
              fulfillmentType:
                type: string
              totalLeones:
                type: number
              patientName:
                type: string
              pharmacyName:
                type: ["string", "null"]
              createdAt:
                type: string

    HqCourierSummary:
      type: object
      required: [id, name, phone]
      properties:
        id:
          type: string
        name:
          type: string
        phone:
          type: string

    HqOrder:
      type: object
      required:
        [
          id,
          pharmacyId,
          patientName,
          patientPhone,
          status,
          fulfillmentType,
          idChecked,
          totalLeones,
          cashCollected,
          paymentMethod,
          createdAt,
          updatedAt,
          items,
        ]
      properties:
        id:
          type: string
        pharmacyId:
          type: string
        pharmacyName:
          type: ["string", "null"]
        pharmacyAddress:
          type: ["string", "null"]
          description: Where the courier collects the order.
        pharmacyPhone:
          type: ["string", "null"]
        patientName:
          type: string
        patientPhone:
          type: string
        deliveryAddress:
          type: ["string", "null"]
          description: Landmark and directions the patient gave for the rider.
        deliveryLatitude:
          type: ["string", "null"]
          description: Latitude of the patient's delivery pin.
        deliveryLongitude:
          type: ["string", "null"]
          description: Longitude of the patient's delivery pin.
        deliveryZoneName:
          type: ["string", "null"]
        status:
          type: string
          enum:
            [
              awaiting_payment,
              paid,
              confirmed,
              packaging,
              ready,
              assigned,
              picked_up,
              delivering,
              delivered,
              collected,
              cancelled,
            ]
        fulfillmentType:
          type: string
          enum: [delivery, collection]
        idChecked:
          type: boolean
        totalLeones:
          type: number
        medicineMarkupBasisPoints:
          type: number
        pharmacyMedicineTotalMinor:
          type: number
        medicineCommissionMinor:
          type: number
        patientMedicineTotalMinor:
          type: number
        deliveryFeeMinor:
          type: number
        courierPayoutMinor:
          type: number
        deliveryCommissionMinor:
          type: number
        completedAt:
          type: ["string", "null"]
        deliveryConfirmedAt:
          type: ["string", "null"]
        deliveryConfirmationMethod:
          type: ["string", "null"]
          enum: [patient, hq, null]
        deliveryConfirmedByHqUserId:
          type: ["string", "null"]
        prescriptionId:
          type: ["string", "null"]
        courierId:
          type: ["string", "null"]
        courier:
          oneOf:
            - $ref: "#/components/schemas/HqCourierSummary"
            - type: "null"
        cashCollected:
          type: boolean
        cashCollectedAt:
          type: ["string", "null"]
        paymentMethod:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"

    AssignCourierInput:
      type: object
      required: [courierId]
      properties:
        courierId:
          type: string

    CourierStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [delivering]

    HqPharmacy:
      type: object
      required:
        [
          id,
          name,
          username,
          isActive,
          controlledSubstanceAuthorized,
          mustChangePassword,
          sessionVersion,
          passwordLastChangedAt,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
        name:
          type: string
        username:
          type: string
        phone:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        locationLat:
          type: ["string", "null"]
        locationLng:
          type: ["string", "null"]
        orangeMoneyNumber:
          type: ["string", "null"]
        afriMoneyNumber:
          type: ["string", "null"]
        mobileMoneyAccountName:
          type: ["string", "null"]
        mobileMoneyNumber:
          type: ["string", "null"]
          deprecated: true
          description: Superseded by orangeMoneyNumber / afriMoneyNumber.
        mobileMoneyProvider:
          type: ["string", "null"]
          deprecated: true
          description: Superseded by orangeMoneyNumber / afriMoneyNumber.
        latitude:
          type: ["number", "null"]
        longitude:
          type: ["number", "null"]
        isActive:
          type: boolean
        controlledSubstanceAuthorized:
          type: boolean
        mustChangePassword:
          type: boolean
        sessionVersion:
          type: number
        passwordLastChangedAt:
          type: string
        temporaryPasswordExpiresAt:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string

    PharmacyOnboardInput:
      type: object
      required: [name, username]
      properties:
        name:
          type: string
          minLength: 1
        username:
          type: string
          minLength: 3
        phone:
          type: string
        email:
          type: string
        address:
          type: string
        orangeMoneyNumber:
          type: string
          minLength: 6
          maxLength: 32
        afriMoneyNumber:
          type: string
          minLength: 6
          maxLength: 32
        mobileMoneyAccountName:
          type: string
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180

    PharmacyOnboardResponse:
      type: object
      required: [pharmacy, tempPassword, temporaryPasswordExpiresAt]
      properties:
        pharmacy:
          $ref: "#/components/schemas/HqPharmacy"
        tempPassword:
          type: string
          description: Shown once — store it securely and hand it to the pharmacy
        temporaryPasswordExpiresAt:
          type: string
          description: ISO timestamp when the temporary password expires

    PharmacyResetPasswordResponse:
      type: object
      required: [tempPassword, temporaryPasswordExpiresAt, pharmacy]
      properties:
        tempPassword:
          type: string
          description: Shown once — hand it to the pharmacy immediately; it is not stored in plaintext
        temporaryPasswordExpiresAt:
          type: string
          description: ISO timestamp when the temporary password expires
        pharmacy:
          $ref: "#/components/schemas/HqPharmacy"

    PasswordPolicy:
      type: object
      required:
        [
          id,
          maxPasswordAgeDays,
          passwordExpiryWarningDays,
          minPasswordLength,
          requireUppercase,
          requireLowercase,
          requireNumber,
          requireSymbol,
          passwordHistoryCount,
          temporaryPasswordExpiryHours,
          createdAt,
          updatedAt,
