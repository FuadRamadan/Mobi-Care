    DrugCatalogueItem:
      type: object
      required: [id, name, tier, unit, isApproved, createdAt]
      properties:
        id:
          type: string

        name:
          type: string
        genericName:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        tier:
          type: string
          enum: ["1", "2", "3"]
        unit:
