          minimum: 1
        stockQuantity:
          type: number
          minimum: 0
        lowStockAlertAt:
          type: number
          minimum: 0
        availableForDelivery:
          type: boolean
        availableForCollection:
          type: boolean
        isActive:
          type: boolean

    # ── Catalogue schemas ──────────────────────────────────────────────────
    DrugCatalogueItem:
