                $ref: "#/components/schemas/AnalyticsOverview"

  /pharmacy/analytics/orders-by-day:
    get:
      operationId: getOrdersByDay
      tags: [analytics]
      summary: Orders and revenue grouped by day (last 30 days)
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Daily order data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DailyOrderStat"

  # ── Public team ───────────────────────────────────────────────────────────
  /team:
    get:
      operationId: listTeamMembers
      tags: [hq]
      summary: Public team roster for the About page
      responses:
        "200":
          description: Team members in display order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamMember"

  /team/{id}/photo:
    get:
      operationId: getTeamMemberPhoto
      tags: [hq]
      summary: Public profile photo for a team member
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Profile photo image
        "404":
          description: Team member or photo not found

  /advertisements:
    get:
      operationId: listAdvertisements
      tags: [advertisements]
      summary: Currently active patient advertisements in display order
      responses:
        "200":
          description: Displayable advertisements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicAdvertisement"

  /advertisements/{id}/media:
    get:
      operationId: getAdvertisementMedia
      tags: [advertisements]
      summary: Stream media belonging to an existing advertisement
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Advertisement image or video bytes
        "404":
          description: Advertisement or media not found

  /advertisements/{id}/media/{mediaId}:
    get:
      operationId: getAdvertisementGalleryMedia
      tags: [advertisements]
      summary: Stream an extra picture belonging to an existing advertisement
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: mediaId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Picture bytes
        "404":
          description: Advertisement or picture not found

  # ── HQ ────────────────────────────────────────────────────────────────────
  /hq/dashboard:
    get:
      operationId: getHqDashboard
      tags: [hq]
      summary: HQ command centre — aggregates, live feed, and completed delivered/collected revenue
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HqDashboard"

  /hq/dashboard/trends:
    get:
      operationId: getHqDashboardTrends
      tags: [hq]
      summary: Zero-filled daily searches, completed orders, and platform commission
      security:
        - BearerAuth: []
      parameters:
        - name: start
          in: query
          required: true
          schema: { type: string, format: date }
        - name: end
          in: query
          required: true
          schema: { type: string, format: date }
        - name: pharmacyId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Daily trends including zero-value dates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HqDashboardTrends"

  /hq/insights:
    get:
      operationId: getHqInsights
      tags: [hq]
      summary: Permission-protected aggregate-only Data & Insights metrics, with all cohorts and buckets under 10 suppressed
      security:
        - BearerAuth: []
      parameters:
        - name: start
          in: query
          schema: { type: string, format: date }
        - name: end
          in: query
          schema: { type: string, format: date }
        - name: interval
          in: query
          schema: { type: string, enum: [day, week, month] }
        - name: pharmacyId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Aggregate metrics only; small groups are suppressed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HqInsights"
        "403": { description: Data & Insights permission required }

  /hq/insights/export.csv:
    get:
      operationId: exportHqInsightsCsv
      tags: [hq]
      summary: Download aggregate-only Data & Insights CSV; values with fewer than 10 contributing records are marked SUPPRESSED
      security:
        - BearerAuth: []
      parameters:
        - name: start
          in: query
          schema: { type: string, format: date }
        - name: end
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: CSV containing aggregate metrics only. Buckets under 10 are omitted and suppressed totals are marked SUPPRESSED.
          content:
            text/csv:
              schema: { type: string }

  /hq/insights/reset:
    get:
      operationId: previewHqPilotReset
      tags: [hq]
      summary: Row counts a pilot-data reset would remove, plus what it keeps
      description: >
        Read-only. Returns the confirmation phrase, per-table counts, and the
        list of data the reset preserves, so the confirmation dialog can show
        real numbers rather than a generic warning. Requires both the Data &
        Insights and settlement-management permissions.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: What a reset would remove right now
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PilotResetPreview"
        "403": { description: Data & Insights and settlement permissions required }
    post:
      operationId: resetHqPilotData
      tags: [hq]
      summary: Permanently clear the searches, orders, prescriptions and commission ledger collected during the pilot
      description: >
        Irreversible, and applied as a single transaction. Pharmacies, patients,
        HQ staff, the drug catalogue, inventory and the append-only audit log are
        never touched; the reset writes its own entry to that audit log. The
        request body must repeat the confirmation phrase exactly.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PilotResetRequest"
      responses:
        "200":
          description: Rows removed, by table
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PilotResetResult"
        "400": { description: Missing or incorrect confirmation phrase; nothing was removed }
        "403": { description: Data & Insights and settlement permissions required }

  /hq/notifications:
    get:
      operationId: listHqNotifications
      tags: [hq]
      summary: List notifications for the authenticated HQ staff member
      security:
        - BearerAuth: []
      responses:
        "200":
          description: HQ notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HqNotification"

  /hq/notifications/unread-count:
    get:
      operationId: getHqUnreadCount
      tags: [hq]
      summary: Get the authenticated HQ staff member's unread notification count
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Unread count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadCount"

  /hq/notifications/mark-read:
    post:
      operationId: markHqNotificationsRead
      tags: [hq]
      summary: Mark HQ notifications as read (omit ids to mark all)
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkReadInput"
      responses:
        "200":
          description: Marked as read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /hq/orders:
    get:
      operationId: listHqOrders
      tags: [hq]
      summary: All orders across all pharmacies
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
