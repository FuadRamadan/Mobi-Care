components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    PatientPasswordResetRequest:
      type: object
      properties:
        phone:
          type: string
          minLength: 5
      required: [phone]

    PatientPasswordResetRequested:
      type: object
      properties:
        requestId:
          type: string
          pattern: '^[0-9a-fA-F-]{36}$'
        message:
          type: string
        retryAfterSeconds:
          type: number
          minimum: 0
      required: [requestId, message, retryAfterSeconds]

    PatientPasswordResetConfirm:
      type: object
      properties:
        requestId:
          type: string
          pattern: '^[0-9a-fA-F-]{36}$'
        code:
          type: string
          pattern: '^[0-9]{6}$'
        newPassword:
          type: string
          minLength: 8
      required: [requestId, code, newPassword]

    # ── Auth schemas ───────────────────────────────────────────────────────
    LoginInput:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
          description: Username or phone number
        password:
          type: string

    RefreshInput:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    ChangePasswordInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8

    PasswordChangeResult:
      type: object
      required: [message]
      properties:
        message:
          type: string
        accessToken:
          type: string
          description: Fresh access token (pharmacy accounts only)
        refreshToken:
          type: string
          description: Fresh refresh token (pharmacy accounts only)
        user:
          $ref: "#/components/schemas/PharmacyUser"
        passwordPolicy:
          $ref: "#/components/schemas/PasswordPolicy"

    PharmacyUser:
      type: object
      required: [id, role, name, username]
      properties:
        id:
          type: string

        role:
          type: string
          enum: [pharmacy, hq, patient]
        name:
          type: string
        username:
          type: string
        phone:
          type: ["string", "null"]
        controlledSubstanceAuthorized:
          type: boolean
          description: Present for pharmacy accounts only
        mustChangePassword:
          type: boolean
          description: Pharmacy accounts onboarded with a temp password must change it before using the portal API
        passwordLastChangedAt:
          type: string
          description: ISO timestamp of the pharmacy account's most recent password change
        canManageIntegrations:
          type: boolean
          description: Present for HQ accounts; controls access to API connection management

    TokenPair:
      type: object
      required: [accessToken, refreshToken]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string

    AuthResponse:
      type: object
      required: [accessToken, refreshToken, user]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          $ref: "#/components/schemas/PharmacyUser"
        passwordPolicy:
          $ref: "#/components/schemas/PasswordPolicy"

    # ── Order schemas ──────────────────────────────────────────────────────
    OrderStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [confirmed, packaging, ready]

    CollectedConfirmation:
      type: object
      required: [idChecked]
      properties:
        idChecked:
          type: boolean

    OrderItem:
      type: object
      required: [id, orderId, drugId, drugName, quantity, unitPriceLeones]
      properties:
        id:
          type: string

        orderId:
          type: string

        drugId:
          type: string
        inventoryId:
          type: ["string", "null"]

        drugName:
          type: string
        quantity:
          type: number
        unitPriceLeones:
          type: number
        prescriptionId:
          type: ["string", "null"]

    Order:
      type: object
      required:
        [
          id,
          pharmacyId,
          patientName,
          patientPhone,
          status,
          fulfillmentType,
          idChecked,
          totalLeones,
          createdAt,
          updatedAt,
          items,
        ]
      properties:
        id:
          type: string

        pharmacyId:
          type: string

        patientName:
          type: string
        patientPhone:
          type: string
        status:
          type: string
          enum:
            [
              awaiting_payment,
              paid,
              confirmed,
              packaging,
              ready,
              assigned,
              picked_up,
              delivering,
              delivered,
              collected,
              cancelled,
            ]
        fulfillmentType:
          type: string
          enum: [delivery, collection]
        idChecked:
          type: boolean
        totalLeones:
          type: number
        prescriptionId:
          type: ["string", "null"]

        createdAt:
          type: string

        updatedAt:
          type: string

        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"

    # ── Patient schemas ────────────────────────────────────────────────────
    PatientRegisterInput:
      type: object
      required: [name, phone, password]
      properties:
        name:
          type: string
          minLength: 2
        phone:
          type: string
          minLength: 5
        password:
          type: string
          minLength: 8

    DrugOffer:
      type: object
      required:
        [
          inventoryId,
          pharmacyId,
          pharmacyName,
          priceLeones,
          unitOfSale,
          inStock,
          availableForDelivery,
          availableForCollection,
        ]
      properties:
        inventoryId:
          type: string
        pharmacyId:
          type: string
        pharmacyName:
          type: string
        pharmacyAddress:
          type: ["string", "null"]
        brand:
          type: ["string", "null"]
        manufacturer:
          type: ["string", "null"]
        priceLeones:
          type: number
        unitOfSale:
          type: string
        inStock:
          type: boolean
        availableForDelivery:
          type: boolean
        availableForCollection:
          type: boolean

    DrugSearchResult:
      type: object
      required:
        [
          listingKey,
          drugId,
          name,
          strength,
          form,
          unitOfSale,
          tier,
          prescriptionRequired,
          collectionOnly,
          offers,
        ]
      properties:
        listingKey:
          type: string
        drugId:
          type: string
        name:
          type: string
        genericName:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        tier:
          type: string
          enum: ["1", "2", "3"]
        unit:
          type: string
        strength:
          type: string
        form:
          type: string
        unitOfSale:
          type: string
        primaryCategory:
          oneOf:
            - $ref: "#/components/schemas/DrugPrimaryCategory"
            - type: "null"
        subcategory:
          oneOf:
            - $ref: "#/components/schemas/DrugSubcategory"
            - type: "null"
        maxUnitsPerOrder:
          type: ["number", "null"]
        prescriptionRequired:
          type: boolean
        collectionOnly:
          type: boolean
        offers:
          type: array
          items:
            $ref: "#/components/schemas/DrugOffer"

    PatientOrderItemInput:
      type: object
      required: [inventoryId, quantity]
      properties:
        inventoryId:
          type: string
        quantity:
          type: number
          minimum: 1

    PatientOrderInput:
      type: object
      required: [pharmacyId, fulfillmentType, items]
      properties:
        pharmacyId:
          type: string
        fulfillmentType:
          type: string
          enum: [delivery, collection]
        deliveryAddress:
          type: string
        prescriptionImageKey:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/PatientOrderItemInput"

    OrderPharmacyInfo:
