        form:
          type: ["string", "null"]
        unitOfSale:
          type: ["string", "null"]
        expiryDate:
          type: ["string", "null"]
        brand:
          type: ["string", "null"]
        manufacturer:
          type: ["string", "null"]
        countryOfOrigin:
          type: ["string", "null"]
        primaryCategory:
          oneOf:
            - $ref: "#/components/schemas/DrugPrimaryCategory"
