          enum: [pharmacy, courier]
        reference:
          type: string

    PatientNotification:
      type: object
      required: [id, patientId, title, body, createdAt]
      properties:
        id:
          type: string
        patientId:
          type: string
        title:
          type: string
        body:
          type: string
        type:
          type: ["string", "null"]
          description: e.g. "order_status", "prescription_rejected", "order_cancelled"
        referenceId:
          type: ["string", "null"]
          description: Related order or entity id
        readAt:
          type: ["string", "null"]
          description: ISO timestamp when the notification was read, or null if unread
        createdAt:
          type: string

    AuditEntry:
      type: object
      required: [id, actorType, action, entityType, createdAt]
      properties:
        id:
          type: string
        actorType:
          type: string
        actorId:
          type: ["string", "null"]
        actorName:
          type: ["string", "null"]
        action:
          type: string
        entityType:
          type: string
        entityId:
          type: ["string", "null"]
        details: {}
        createdAt:
          type: string
