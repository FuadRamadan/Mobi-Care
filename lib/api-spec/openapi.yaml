        countryOfOrigin:
          type: string
        priceLeones:
          type: number
          minimum: 1
        stockQuantity:
          type: number
          minimum: 0
        lowStockAlertAt:
          type: number
          minimum: 0
        availableForDelivery:
          type: boolean
        availableForCollection:
          type: boolean

    InventoryUpdate:
      type: object
      properties:
        brand:
          type: string
        countryOfOrigin:
          type: string
        priceLeones:
          type: number
          minimum: 1
        stockQuantity:
          type: number
          minimum: 0
        lowStockAlertAt:
          type: number
          minimum: 0
        availableForDelivery:
          type: boolean
        availableForCollection:
          type: boolean
        isActive:
          type: boolean

