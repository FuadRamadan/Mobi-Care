      operationId: clearPatientNotifications
      tags: [patient]
      summary: Delete all notifications owned by the authenticated patient
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Deleted notification count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletionResult"

  /patient/notifications/{id}:
