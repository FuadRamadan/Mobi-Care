        [
          id,
          pharmacyId,
          patientName,
          patientPhone,
          status,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string

        pharmacyId:
          type: string

        patientName:
          type: string
        patientPhone:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected]
        approvedDrugIds:
          type: ["array", "null"]
          items:
            type: string

        rejectReason:
          type: ["string", "null"]
          enum:
            - illegible_image
            - expired_prescription
            - invalid_prescription
            - drug_unavailable
            - controlled_substance_not_authorized
            - patient_mismatch
            - quantity_exceeded
            - "null"
        rejectNote:
          type: ["string", "null"]
        reviewedAt:
          type: ["string", "null"]

        orderId:
          type: ["string", "null"]

        createdAt:
          type: string

        updatedAt:
          type: string

    PrescriptionApproval:
      type: object
      required: [approvedDrugIds]
      properties:
        approvedDrugIds:
          type: array
          items:
            type: string

          minItems: 1

    PrescriptionRejection:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          enum:
            - illegible_image
            - expired_prescription
            - invalid_prescription
            - drug_unavailable
            - controlled_substance_not_authorized
            - patient_mismatch
            - quantity_exceeded
        note:
          type: string

    ImageUrlRequest:
      type: object
      properties:
        variant:
          type: string
