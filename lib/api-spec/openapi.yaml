openapi: 3.1.0
info:
  title: Api
  version: 0.2.0
  description: MobiCare Pharmacy Portal API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: orders
    description: Pharmacy orders
  - name: inventory
    description: Pharmacy inventory
  - name: catalogue
    description: Drug catalogue
  - name: prescriptions
    description: Prescription management
  - name: notifications
    description: Pharmacy notifications
  - name: analytics
    description: Dashboard analytics
  - name: hq
    description: MobiCare HQ oversight (HQ role required)
  - name: patient
    description: Patient experience (patient role required)

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Auth ──────────────────────────────────────────────────────────────────
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with identifier and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Token pair and user info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials

  /auth/refresh:
    post:
      operationId: refreshToken
      tags: [auth]
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshInput"
      responses:
        "200":
          description: New token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"

  /auth/patient-password-reset/request:
    post:
      operationId: requestPatientPasswordReset
      tags: [auth]
      summary: Request a patient password reset code by SMS
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientPasswordResetRequest"
      responses:
        "200":
          description: Generic acknowledgement that does not reveal account existence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientPasswordResetRequested"
        "429":
          description: Too many recovery requests

  /auth/patient-password-reset/confirm:
    post:
      operationId: confirmPatientPasswordReset
      tags: [auth]
      summary: Verify a patient reset code and set a new password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientPasswordResetConfirm"
      responses:
        "200":
          description: Password reset successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid, expired, used, or over-attempted code
        "409":
          description: Reset request was already completed concurrently
        "429":
          description: Too many verification attempts

  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change password (authenticated). For pharmacy accounts, returns a fresh token pair and user so the frontend can continue without re-logging in.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "200":
          description: Password changed — pharmacy accounts receive a fresh token pair; HQ/patient receive a message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordChangeResult"
        "422":
          description: Password does not meet policy requirements

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Invalidate refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshInput"
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # ── Orders ────────────────────────────────────────────────────────────────
  /pharmacy/orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List orders for this pharmacy
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of orders with items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"

  /pharmacy/orders/{id}/status:
    patch:
      operationId: updateOrderStatus
      tags: [orders]
      summary: Advance order status (confirmed / packaging / ready)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusUpdate"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "409":
          description: Invalid status transition

  /pharmacy/orders/{id}/collected:
    post:
      operationId: markOrderCollected
      tags: [orders]
      summary: Mark order collected (in-person ID checked)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectedConfirmation"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /pharmacy/orders/{id}/picked-up:
    post:
      operationId: markOrderPickedUp
      tags: [orders]
      summary: Mark order picked up by courier
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string

      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  # ── Inventory ─────────────────────────────────────────────────────────────
  /pharmacy/inventory:
    get:
      operationId: listInventory
      tags: [inventory]
      summary: List this pharmacy's inventory listings
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Inventory listings with drug info
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryItem"

    post:
      operationId: addInventoryItem
      tags: [inventory]
      summary: Add a drug listing to inventory
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryInput"
      responses:
        "201":
          description: Created listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"

  /pharmacy/inventory/{id}:
    patch:
      operationId: updateInventoryItem
      tags: [inventory]
      summary: Update price, stock, or availability
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryUpdate"
      responses:
        "200":
          description: Updated listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"

    delete:
      operationId: deleteInventoryItem
      tags: [inventory]
      summary: Remove a drug listing
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string

      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # ── Catalogue ─────────────────────────────────────────────────────────────
  /pharmacy/catalogue:
    get:
      operationId: listCatalogue
      tags: [catalogue]
      summary: List approved drugs in the master catalogue
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Catalogue drugs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DrugCatalogueItem"

    post:
      operationId: proposeDrug
      tags: [catalogue]
      summary: Propose a new drug (held for HQ approval)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DrugProposal"
      responses:
        "202":
          description: Proposal submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DrugCatalogueItem"

  /pharmacy/catalogue/categories:
    get:
      operationId: listDrugCategories
      tags: [catalogue]
      summary: List the HQ-controlled medicine category taxonomy
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Controlled two-tier category taxonomy
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DrugCategory"

  # ── Prescriptions ─────────────────────────────────────────────────────────
  /pharmacy/prescriptions:
    get:
      operationId: listPrescriptions
      tags: [prescriptions]
      summary: List prescriptions for this pharmacy
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Prescriptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Prescription"

  /pharmacy/prescriptions/{id}:
    get:
      operationId: getPrescription
      tags: [prescriptions]
      summary: Get a single prescription
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string

      responses:
        "200":
          description: Prescription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prescription"

  /pharmacy/prescriptions/{id}/approve:
    post:
      operationId: approvePrescription
      tags: [prescriptions]
      summary: Approve prescription (subset of drugs)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrescriptionApproval"
      responses:
        "200":
          description: Approved prescription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prescription"

  /pharmacy/prescriptions/{id}/reject:
    post:
      operationId: rejectPrescription
      tags: [prescriptions]
      summary: Reject prescription with a reason from a fixed enum
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrescriptionRejection"
      responses:
        "200":
          description: Rejected prescription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prescription"

  /pharmacy/prescriptions/{id}/image-url:
    post:
      operationId: getPrescriptionImageUrl
      tags: [prescriptions]
      summary: Mint a short-lived signed URL for the prescription image
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string

      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageUrlRequest"
      responses:
        "200":
          description: Signed image URL (15 min TTL)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageUrlResponse"

  # ── Patient experience ─────────────────────────────────────────────────────
  /auth/register:
    post:
      operationId: registerPatient
      tags: [auth]
      summary: Register a patient account (self-service)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientRegisterInput"
      responses:
        "201":
          description: Account created — token pair and user info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          description: Phone already registered

  /patient/search:
    get:
      operationId: patientSearchDrugs
      tags: [patient]
      summary: Search medicines across all pharmacies with price comparison
      security:
        - BearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: category
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/DrugPrimaryCategory"
        - name: subcategory
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/DrugSubcategory"
      responses:
        "200":
          description: Drugs with per-pharmacy price offers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DrugSearchResult"

  /patient/search/categories:
    get:
      operationId: listPatientDrugCategories
      tags: [patient]
      summary: List medicine categories available for patient search
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Controlled two-tier category taxonomy
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DrugCategory"

  /patient/orders:
    get:
      operationId: patientListOrders
      tags: [patient]
      summary: List the authenticated patient's own orders
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Patient orders with items, pharmacy, courier, prescription status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PatientOrder"
    post:
      operationId: patientCreateOrder
      tags: [patient]
      summary: Place an order (delivery or collection)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientOrderInput"
      responses:
        "201":
          description: Created order (awaiting payment)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientOrder"
        "409":
          description: Stock, tier, or availability conflict

  /patient/orders/{id}:
    get:
      operationId: patientGetOrder
      tags: [patient]
      summary: Get one of the patient's own orders
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order with items, pharmacy, courier, prescription status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientOrder"

  /patient/orders/{id}/confirm-receipt:
    post:
      operationId: confirmPatientOrderReceipt
      tags: [patient]
      summary: Confirm receipt of the authenticated patient's delivery order
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order moved from delivering to delivered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientOrder"
        "404":
          description: Order does not belong to the authenticated patient
        "409":
          description: Order is not a delivery currently in progress

  /patient/orders/{id}/pay:
    post:
      operationId: patientPayOrder
      tags: [patient]
      summary: Record mobile-money payment (no live gateway yet)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order moved to paid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientOrder"
        "409":
          description: Order is expired, already paid, or current inventory is insufficient

  /patient/uploads/prescription:
    post:
      operationId: patientUploadPrescription
      tags: [patient]
      summary: Upload a prescription image (base64 data URL)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrescriptionUploadInput"
      responses:
        "201":
          description: Stored — opaque image key to attach to an order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrescriptionUploadResponse"

  # ── Patient notifications ─────────────────────────────────────────────────
  /patient/notifications:
    get:
      operationId: listPatientNotifications
      tags: [patient]
      summary: List the authenticated patient's notifications (newest first)
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Patient notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PatientNotification"

  /patient/notifications/unread-count:
    get:
      operationId: getPatientUnreadCount
      tags: [patient]
      summary: Get unread notification count for the authenticated patient
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Unread count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadCount"

  /patient/notifications/push-token:
    put:
      operationId: updatePatientPushToken
      tags: [patient]
      summary: Register or clear the patient's Expo push token
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushTokenInput"
      responses:
        "200":
          description: Push token updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /patient/notifications/mark-read:
    post:
      operationId: markPatientNotificationsRead
      tags: [patient]
      summary: Mark patient notifications as read (omit ids to mark all)
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkReadInput"
      responses:
        "200":
          description: Marked as read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # ── Notifications ─────────────────────────────────────────────────────────
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List all notifications
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"

  /notifications/unread-count:
    get:
      operationId: getUnreadCount
      tags: [notifications]
      summary: Get unread notification count
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Unread count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadCount"

  /notifications/mark-read:
    post:
      operationId: markNotificationsRead
      tags: [notifications]
      summary: Mark notifications as read
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkReadInput"
      responses:
        "200":
          description: Marked as read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # ── Analytics ─────────────────────────────────────────────────────────────
  /pharmacy/analytics/overview:
    get:
      operationId: getAnalyticsOverview
      tags: [analytics]
      summary: Dashboard overview — order counts, revenue, pending work
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Analytics overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsOverview"

  /pharmacy/analytics/orders-by-day:
    get:
      operationId: getOrdersByDay
      tags: [analytics]
      summary: Orders and revenue grouped by day (last 30 days)
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Daily order data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DailyOrderStat"

  # ── Public team ───────────────────────────────────────────────────────────
  /team:
    get:
      operationId: listTeamMembers
      tags: [hq]
      summary: Public team roster for the About page
      responses:
        "200":
          description: Team members in display order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamMember"

  /team/{id}/photo:
    get:
      operationId: getTeamMemberPhoto
      tags: [hq]
      summary: Public profile photo for a team member
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Profile photo image
        "404":
          description: Team member or photo not found

  # ── HQ ────────────────────────────────────────────────────────────────────
  /hq/dashboard:
    get:
      operationId: getHqDashboard
      tags: [hq]
      summary: HQ command centre — aggregates, live feed, revenue
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HqDashboard"

  /hq/notifications:
    get:
      operationId: listHqNotifications
      tags: [hq]
      summary: List notifications for the authenticated HQ staff member
      security:
        - BearerAuth: []
      responses:
        "200":
          description: HQ notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HqNotification"

  /hq/notifications/unread-count:
    get:
      operationId: getHqUnreadCount
      tags: [hq]
      summary: Get the authenticated HQ staff member's unread notification count
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Unread count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadCount"

  /hq/notifications/mark-read:
    post:
      operationId: markHqNotificationsRead
      tags: [hq]
      summary: Mark HQ notifications as read (omit ids to mark all)
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkReadInput"
      responses:
        "200":
          description: Marked as read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /hq/orders:
    get:
      operationId: listHqOrders
      tags: [hq]
      summary: All orders across all pharmacies
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HqOrder"

  /hq/orders/dispatch:
    get:
      operationId: listDispatchOrders
      tags: [hq]
      summary: Delivery orders in the dispatch pipeline
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Dispatch orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HqOrder"

  /hq/orders/{id}/assign-courier:
    post:
      operationId: assignCourier
      tags: [hq]
      summary: Assign a courier to a ready delivery order
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignCourierInput"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HqOrder"
        "409":
          description: Invalid state

  /hq/orders/{id}/courier-status:
    patch:
      operationId: updateCourierStatus
      tags: [hq]
