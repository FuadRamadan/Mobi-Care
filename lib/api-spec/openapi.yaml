        form:
          type: string
          minLength: 1
        unitOfSale:
          type: string
          minLength: 1
        expiryDate:
          type: string
        brand:
          type: string
        manufacturer:
          type: string
        countryOfOrigin:
          type: string
        primaryCategory:
          $ref: "#/components/schemas/DrugPrimaryCategory"
        subcategory:
          $ref: "#/components/schemas/DrugSubcategory"
        otherCategoryText:
