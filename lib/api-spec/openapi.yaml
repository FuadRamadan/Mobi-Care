openapi: 3.1.0
info:
  title: Api
  version: 0.2.0
  description: MobiCare Pharmacy Portal API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: orders
    description: Pharmacy orders
  - name: inventory
    description: Pharmacy inventory
  - name: catalogue
    description: Drug catalogue
  - name: prescriptions
    description: Prescription management
  - name: notifications
    description: Pharmacy notifications
  - name: analytics
    description: Dashboard analytics
  - name: hq
    description: MobiCare HQ oversight (HQ role required)
  - name: patient
    description: Patient experience (patient role required)

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Auth ──────────────────────────────────────────────────────────────────
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with identifier and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Token pair and user info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials

  /auth/refresh:
    post:
      operationId: refreshToken
      tags: [auth]
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshInput"
      responses:
        "200":
          description: New token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"

  /auth/patient-password-reset/request:
    post:
      operationId: requestPatientPasswordReset
      tags: [auth]
      summary: Request a patient password reset code by SMS
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientPasswordResetRequest"
      responses:
        "200":
          description: Generic acknowledgement that does not reveal account existence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientPasswordResetRequested"
        "429":
          description: Too many recovery requests

  /auth/patient-password-reset/confirm:
    post:
      operationId: confirmPatientPasswordReset
      tags: [auth]
      summary: Verify a patient reset code and set a new password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientPasswordResetConfirm"
      responses:
        "200":
          description: Password reset successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid, expired, used, or over-attempted code
        "409":
          description: Reset request was already completed concurrently
        "429":
          description: Too many verification attempts

  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change password (authenticated). For pharmacy accounts, returns a fresh token pair and user so the frontend can continue without re-logging in.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "200":
          description: Password changed — pharmacy accounts receive a fresh token pair; HQ/patient receive a message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordChangeResult"
        "422":
          description: Password does not meet policy requirements

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Invalidate refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshInput"
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # ── Orders ────────────────────────────────────────────────────────────────
  /pharmacy/orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List orders for this pharmacy
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of orders with items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"

  /pharmacy/orders/{id}/status:
    patch:
      operationId: updateOrderStatus
      tags: [orders]
      summary: Advance order status (confirmed / packaging / ready)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusUpdate"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "409":
          description: Invalid status transition

  /pharmacy/orders/{id}/collected:
    post:
      operationId: markOrderCollected
      tags: [orders]
      summary: Mark order collected (in-person ID checked)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectedConfirmation"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /pharmacy/orders/{id}/picked-up:
    post:
      operationId: markOrderPickedUp
      tags: [orders]
      summary: Mark order picked up by courier
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string

      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  # ── Inventory ─────────────────────────────────────────────────────────────
  /pharmacy/inventory:
    get:
      operationId: listInventory
      tags: [inventory]
      summary: List this pharmacy's inventory listings
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Inventory listings with drug info
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryItem"

    post:
      operationId: addInventoryItem
      tags: [inventory]
      summary: Add a drug listing to inventory
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryInput"
      responses:
        "201":
          description: Created listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"

  /pharmacy/inventory/import/template:
    get:
      operationId: getInventoryTemplate
      tags: [inventory]
      summary: The spreadsheet template for a bulk upload
      security:
        - BearerAuth: []
      responses:
        "200":
          description: The template as a base64-encoded .xlsx file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpreadsheetFile"

  /pharmacy/inventory/export:
    get:
      operationId: exportInventory
      tags: [inventory]
      summary: The current entries in the bulk-upload format
      security:
        - BearerAuth: []
      responses:
        "200":
          description: The entries as a base64-encoded .xlsx file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpreadsheetFile"

  /pharmacy/inventory/import/preview:
    post:
      operationId: previewInventoryImport
      tags: [inventory]
      summary: Check an uploaded spreadsheet without saving anything
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpreadsheetUpload"
      responses:
        "200":
          description: What saving the file would do, row by row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryImportPreview"
        "400":
          description: The file could not be read

  /pharmacy/inventory/import/apply:
    post:
      operationId: applyInventoryImport
      tags: [inventory]
      summary: Save the valid rows of an uploaded spreadsheet
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpreadsheetApply"
      responses:
        "200":
          description: What was saved, and a file of the rows that were not
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryImportResult"
        "400":
          description: The file could not be read
        "409":
          description: Some duplicate rows need an Override or Skip decision

  /pharmacy/inventory/{id}:
    patch:
      operationId: updateInventoryItem
      tags: [inventory]
      summary: Update price, stock, or availability
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryUpdate"
      responses:
        "200":
          description: Updated listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"

    delete:
      operationId: deleteInventoryItem
      tags: [inventory]
      summary: Remove a drug listing
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string

      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # ── Catalogue ─────────────────────────────────────────────────────────────
  /pharmacy/catalogue:
    get:
      operationId: listCatalogue
      tags: [catalogue]
      summary: List approved drugs in the master catalogue
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Catalogue drugs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DrugCatalogueItem"

    post:
      operationId: proposeDrug
      tags: [catalogue]
      summary: Propose a new drug (held for HQ approval)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DrugProposal"
      responses:
        "202":
          description: Proposal submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DrugCatalogueItem"

  /pharmacy/catalogue/categories:
    get:
      operationId: listDrugCategories
      tags: [catalogue]
      summary: List the HQ-controlled medicine category taxonomy
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Controlled two-tier category taxonomy
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DrugCategory"

  # ── Prescriptions ─────────────────────────────────────────────────────────
  /pharmacy/prescriptions:
    get:
      operationId: listPrescriptions
      tags: [prescriptions]
      summary: List prescriptions for this pharmacy
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Prescriptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Prescription"

  /pharmacy/prescriptions/{id}:
    get:
      operationId: getPrescription
      tags: [prescriptions]
      summary: Get a single prescription
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string

      responses:
        "200":
          description: Prescription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prescription"

  /pharmacy/prescriptions/{id}/approve:
    post:
      operationId: approvePrescription
      tags: [prescriptions]
      summary: Approve prescription (subset of drugs)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrescriptionApproval"
      responses:
        "200":
          description: Approved prescription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prescription"

  /pharmacy/prescriptions/{id}/reject:
    post:
      operationId: rejectPrescription
      tags: [prescriptions]
      summary: Reject prescription with a reason from a fixed enum
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrescriptionRejection"
      responses:
        "200":
          description: Rejected prescription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prescription"

  /pharmacy/prescriptions/{id}/image-url:
    post:
      operationId: getPrescriptionImageUrl
      tags: [prescriptions]
      summary: Mint a short-lived signed URL for the prescription image
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string

      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageUrlRequest"
      responses:
        "200":
          description: Signed image URL (15 min TTL)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageUrlResponse"

  /pharmacy/analytics/online:
    get:
      operationId: getPharmacyOnlineAnalytics
      tags: [analytics]
      summary: Orders paid online through MobiCare, at the pharmacy's own prices
      security:
        - BearerAuth: []
      parameters:
        - name: start
          in: query
          schema: { type: string, format: date }
        - name: end
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Today, zero-filled daily rows, money waiting and completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PharmacyOnlineAnalytics"
        "400":
          description: Bad date range

  /hq/settlements/online:
    get:
      operationId: getHqOnlinePayments
      tags: [hq]
      summary: MobiCare's online-payment figures (needs the settlements permission)
      security:
        - BearerAuth: []
      parameters:
        - name: start
          in: query
          schema: { type: string, format: date }
        - name: end
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Daily fees and refunds, money waiting, owed to pharmacies, refunds to pay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HqOnlinePayments"
        "400":
          description: Bad date range

  /pharmacy/payouts:
    get:
      operationId: getPharmacyPayouts
      tags: [pharmacy]
      summary: The pharmacy's online-payment balance, where cash-outs go, and history
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Balance, destinations, releases and cash-outs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PharmacyPayouts"

  /pharmacy/payouts/cashouts:
    post:
      operationId: requestPharmacyCashout
      tags: [pharmacy]
      summary: Cash out to the registered number of the chosen network
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashoutRequest"
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PharmacyCashout"
        "400":
          description: Invalid request
        "404":
          description: Not found
        "409":
          description: Refused, with a plain reason (error) and a code

  /pharmacy/payouts/cashouts/{id}/cancel:
    post:
      operationId: cancelPharmacyCashout
      tags: [pharmacy]
      summary: Withdraw a cash-out that is waiting for approval
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PharmacyCashout"
        "400":
          description: Invalid request
        "404":
          description: Not found
        "409":
          description: Refused, with a plain reason (error) and a code

  /hq/insights/sales-trend:
    get:
      operationId: getHqSalesTrend
      tags: [hq]
      summary: Daily sales and MobiCare revenue for the Command Centre trend chart
      security:
        - BearerAuth: []
      parameters:
        - name: start
          in: query
          schema: { type: string, format: date }
        - name: end
          in: query
          schema: { type: string, format: date }
        - name: pharmacyId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: One row per day, zero-filled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HqSalesTrend"
        "400":
          description: Bad date range

  /hq/settlements/orders:
    get:
      operationId: getHqSalesHistory
      tags: [hq]
      summary: Sales history, one row per order paid through Monime, with MobiCare's revenue
      security:
        - BearerAuth: []
      parameters:
        - name: start
          in: query
          schema: { type: string, format: date }
        - name: end
          in: query
          schema: { type: string, format: date }
        - name: pharmacyId
          in: query
          schema: { type: string }
        - name: q
          in: query
          description: Order number, patient name or pharmacy name
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: number }
        - name: offset
          in: query
          schema: { type: number }
      responses:
        "200":
          description: Orders in the range, newest payment first, and the range totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HqSalesHistory"
        "400":
          description: Bad date range or filter

  /hq/settlements/payouts:
    get:
      operationId: getHqPayouts
      tags: [hq]
      summary: Pharmacy balances, cash-outs to approve, recent cash-outs, release problems
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Everything HQ needs to run payouts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HqPayouts"

  /hq/settlements/cashouts/{id}/approve:
    post:
      operationId: approveHqCashout
      tags: [hq]
      summary: Approve a cash-out above the limit
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PharmacyCashout"
        "400":
          description: Invalid request
        "404":
          description: Not found
        "409":
          description: Refused, with a plain reason (error) and a code

  /hq/settlements/cashouts/{id}/reject:
    post:
      operationId: rejectHqCashout
      tags: [hq]
      summary: Reject a cash-out waiting for approval
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashoutRejection"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PharmacyCashout"
        "400":
          description: Invalid request
        "404":
          description: Not found
        "409":
          description: Refused, with a plain reason (error) and a code

  /hq/settlements/transfers/{id}/retry:
    post:
      operationId: retryHqTransfer
      tags: [hq]
      summary: Try a failed release again
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferRetry"
        "400":
          description: Invalid request
        "404":
          description: Not found
        "409":
          description: Refused, with a plain reason (error) and a code

  /auth/register:
    post:
      operationId: registerPatient
      tags: [auth]
      summary: Register a patient account (self-service)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientRegisterInput"
      responses:
        "201":
          description: Account created — token pair and user info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          description: Phone already registered

  /auth/google/config:
    get:
      operationId: getGoogleSignInConfig
      tags: [auth]
      summary: The Google Client ID for the patient app's sign-in button (null when not set up)
      responses:
        "200":
          description: Google sign-in settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleSignInConfig"

  /auth/google:
    post:
      operationId: signInWithGoogle
      tags: [auth]
      summary: Sign a patient in with a Google ID token; a new Google account gets a sign-up token instead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleCredentialInput"
      responses:
        "200":
          description: Signed in, or the profile step is needed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleSignInResult"
        "401":
          description: The Google sign-in could not be confirmed

  /auth/google/complete:
    post:
      operationId: completeGoogleSignUp
      tags: [auth]
      summary: Finish a Google sign-up with phone number, date of birth and consent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleSignUpInput"
      responses:
        "201":
          description: Account created and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleSignInResult"
        "409":
          description: Phone already registered

  /auth/google/link:
    post:
      operationId: connectGoogleAccount
      tags: [auth]
      summary: Connect a Google account to the signed-in patient
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleCredentialInput"
      responses:
        "200":
          description: Connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleConnection"
        "409":
          description: That Google account belongs to another patient
    delete:
      operationId: disconnectGoogleAccount
      tags: [auth]
      summary: Disconnect the signed-in patient's Google account (needs a password set)
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleConnection"
        "409":
          description: No password set yet

  /patient/search:
    get:
      operationId: patientSearchDrugs
      tags: [patient]
      summary: Search medicines across all pharmacies with price comparison
      security:
        - BearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: category
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/DrugPrimaryCategory"
        - name: subcategory
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/DrugSubcategory"
        - name: pharmacyId
          in: query
          required: false
          schema: { type: string }
        - name: patientLatitude
          in: query
          required: false
          schema: { type: number, minimum: -90, maximum: 90 }
        - name: patientLongitude
          in: query
          required: false
          schema: { type: number, minimum: -180, maximum: 180 }
      responses:
        "200":
          description: Drugs with per-pharmacy price offers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DrugSearchResult"

  /patient/search/categories:
    get:
      operationId: listPatientDrugCategories
      tags: [patient]
      summary: List medicine categories available for patient search
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Controlled two-tier category taxonomy
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DrugCategory"

  /patient/delivery/coverage:
    get:
      operationId: patientDeliveryCoverage
      tags: [patient]
      summary: Outlines of the areas MobiCare delivers to
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Active delivery zones (names and outlines only)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeliveryCoverageZone"

  /patient/delivery/quote:
    post:
      operationId: patientDeliveryQuote
      tags: [patient]
      summary: The delivery fee from a pharmacy to a pinned location
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryQuoteInput"
      responses:
        "200":
          description: The fee, or why delivery is unavailable there
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryQuote"
        "404":
          description: Pharmacy not found or inactive

  /patient/orders:
    get:
      operationId: patientListOrders
      tags: [patient]
      summary: List the authenticated patient's own orders
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Patient orders with items, pharmacy, courier, prescription status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PatientOrder"
    post:
      operationId: patientCreateOrder
      tags: [patient]
      summary: Place an order (delivery or collection)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientOrderInput"
      responses:
        "201":
          description: Created order (awaiting payment)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientOrder"
        "400":
          description: Invalid order; code DELIVERY_LOCATION_REQUIRED when a delivery has no pinned location
        "409":
          description: Stock, tier, or availability conflict; code DELIVERY_FEE_CHANGED when the quoted delivery fee is no longer current
        "422":
          description: code DELIVERY_UNAVAILABLE when the pharmacy or the pinned location is outside every delivery zone

  /patient/orders/{id}:
    get:
      operationId: patientGetOrder
      tags: [patient]
      summary: Get one of the patient's own orders
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order with items, pharmacy, courier, prescription status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientOrder"

  /patient/orders/{id}/history:
    delete:
      operationId: removePatientOrderFromHistory
      tags: [patient]
      summary: Remove a completed or cancelled order from the patient's history
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order hidden from this patient's history without deleting it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemovalResult"
        "409":
          description: Order is not yet in a removable terminal state

  /patient/orders/{id}/confirm-receipt:
    post:
      operationId: confirmPatientOrderReceipt
      tags: [patient]
      summary: Confirm receipt of the authenticated patient's delivery order
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order moved from delivering to delivered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientOrder"
        "404":
          description: Order does not belong to the authenticated patient
        "409":
          description: Order is not a delivery currently in progress

  /patient/orders/{id}/cancel:
    post:
      operationId: cancelPatientOrder
      tags: [patient]
      summary: Cancel the authenticated patient's order before courier assignment
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientOrder"
        "404":
          description: Order does not belong to the authenticated patient
        "409":
          description: Order already has a courier or cannot be cancelled

  /patient/payments/config:
    get:
      operationId: patientPaymentsConfig
      tags: [patient]
      summary: How this site takes payment (Monime payment link or pay the pharmacy)
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Payment provider and the patient service fee rate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentsConfig"

  /patient/orders/{id}/checkout:
    post:
      operationId: patientStartCheckout
      tags: [patient]
      summary: The Monime payment link for an unpaid order (existing live link or a new one)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The link to send the patient to, or status 'paid' if already paid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutLink"
        "404":
          description: Order not found
        "409":
          description: >-
            The order can't be paid now (prescription pending or rejected,
            payment window over, not a Monime order)
        "502":
          description: Monime did not create the link
        "503":
          description: Online payment temporarily unavailable

  /patient/orders/{id}/payment:
    get:
      operationId: patientGetOrderPayment
      tags: [patient]
      summary: The order's payment state, from MobiCare's records
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Payment state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderPayment"
        "404":
          description: Order not found

  /patient/orders/{id}/payment/check:
    post:
      operationId: patientCheckOrderPayment
      tags: [patient]
      summary: Checks the latest payment link with Monime now (throttled), then returns the payment state
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Payment state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderPayment"
        "404":
          description: Order not found

  /patient/uploads/prescription:
    post:
      operationId: patientUploadPrescription
      tags: [patient]
      summary: Upload a prescription image (base64 data URL)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrescriptionUploadInput"
      responses:
        "201":
          description: Stored — opaque image key to attach to an order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrescriptionUploadResponse"

  /patient/privacy:
    get:
      operationId: getPatientPrivacy
      tags: [patient]
      summary: The patient's consent decisions, and the wording of each choice
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current consent state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientConsentState"

  /patient/privacy/consent:
    post:
      operationId: recordPatientConsent
      tags: [patient]
      summary: Record or withdraw the patient's consent decisions
      description: >
        Append-only. Withdrawing adds a decision saying so; it never edits the
        one that granted it, because the history is the evidence.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientConsentInput"
      responses:
        "200":
          description: The resulting consent state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientConsentState"
        "400": { description: Both decisions must be supplied explicitly }

  /patient/privacy/export:
    get:
      operationId: exportPatientData
      tags: [patient]
      summary: Download everything MobiCare holds about the authenticated patient
      description: >
        Profile, consents, orders and their lines, prescriptions, uploads,
        notifications and search events, as one JSON file. Scoped to the caller;
        there is no route by which one patient reaches another's record.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: >
            A JSON file, sent as an attachment. Top-level keys: exportedAt,
            notice, profile, consents, orders, orderItems, prescriptions,
            prescriptionUploads, notifications, searchEvents.
          content:
            # No schema: the body is a file the patient downloads and keeps, not
            # a contract any client parses. Describing every column of every
            # table here would be a second copy of the schema to keep in step.
            application/json: {}

  /patient/privacy/erase:
    post:
      operationId: erasePatientAccount
      tags: [patient]
      summary: Erase the patient's identity and the data held only for them
      description: >
        Irreversible. Removes search history, notifications, unused prescription
        uploads, every session, and the identity on the account. Orders and any
        prescription attached to them are KEPT as the pharmacy's dispensing
        record, with name, phone number and address removed — a record of what
        was dispensed is not the patient's alone to delete. Requires the
        patient's current password.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientErasureInput"
      responses:
        "200":
          description: What was removed and what was kept
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientErasureResult"
        "400": { description: Missing password or confirmation phrase }
        "403": { description: The password was not correct }

  /patient/profile:
    get:
      operationId: getPatientProfile
      tags: [patient]
      summary: Get the authenticated patient's profile
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Patient profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientProfile"
    patch:
      operationId: updatePatientProfile
      tags: [patient]
      summary: Update editable patient profile fields
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientProfileUpdate"
      responses:
        "200":
          description: Updated patient profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientProfile"

  /patient/profile/photo:
    put:
      operationId: updatePatientProfilePhoto
      tags: [patient]
      summary: Upload or replace the authenticated patient's profile photo
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientProfilePhotoInput"
      responses:
        "200":
          description: Updated patient profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientProfile"

