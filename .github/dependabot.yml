# Security fixes only. With "Dependabot security updates" switched on in the
# repository's Settings > Code security, GitHub opens a pull request whenever a
# package we use gets a security fix. Routine version bumps are switched off
# (limit 0) so the only pull requests are ones that matter. Nothing is merged
# automatically: each one is tested and approved like any other change.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      security-fixes:
        applies-to: security-updates
        patterns: ["*"]
